<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UyParceShopper System">
<meta name="mobile-web-app-capable" content="yes">
<title>UyParceShopper System — Control de compras y envíos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check-compat.js"></script>
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --ink:#121212;
    --ink-soft:#5B5E72;
    --accent:#1E224F;
    --accent-deep:#12142F;
    --line:#DADCE6;
    --line-strong:#1E224F;
    --success:#3E7A4D;
    --success-bg:#E7F1E9;
    --danger:#B4442E;
    --danger-bg:#FBEAE5;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  }
  button{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  .wrap{max-width:920px; margin:0 auto; padding:20px 16px 80px;}

  /* Header — shipping tag motif */
  .tag-header{
    position:relative; background:var(--surface); border:1.5px dashed var(--line-strong);
    border-radius:10px; padding:22px 22px 18px; margin-bottom:18px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .tag-header::before, .tag-header::after{
    content:""; position:absolute; top:50%; width:16px; height:16px; background:var(--bg);
    border:1.5px dashed var(--line-strong); border-radius:50%; transform:translateY(-50%);
  }
  .tag-header::before{ left:-9px; }
  .tag-header::after{ right:-9px; }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:44px; height:44px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-mark svg{width:24px; height:24px;}
  .brand h1{font-size:19px; margin:0; letter-spacing:-0.01em;}
  .brand p{margin:2px 0 0; font-size:12.5px; color:var(--ink-soft);}
  .stats{display:flex; gap:18px; flex-wrap:wrap;}
  .week-bar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    border-top:1px dashed var(--line); margin-top:14px; padding-top:12px; width:100%;
    font-size:12.5px; color:var(--ink-soft);
  }
  .toggle-switch{ position:relative; display:inline-block; width:40px; height:22px; flex-shrink:0; }
  .toggle-switch input{ opacity:0; width:0; height:0; }
  .toggle-slider{ position:absolute; cursor:pointer; inset:0; background:#C9CCDA; border-radius:22px; transition:.2s; }
  .toggle-slider::before{ content:""; position:absolute; height:16px; width:16px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s; }
  .toggle-switch input:checked + .toggle-slider{ background:var(--accent); }
  .toggle-switch input:checked + .toggle-slider::before{ transform:translateX(18px); }
  .toggle-row{ display:flex; align-items:center; gap:8px; }
  .stat{text-align:right;}
  .stat .n{font-family:var(--mono); font-size:20px; font-weight:700; color:var(--accent-deep); line-height:1;}
  .stat .l{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-top:3px;}

  /* Tabs */
  .tabs{display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; padding-bottom:2px;}
  .tab-btn{
    font-family:var(--mono); font-size:12.5px; letter-spacing:.02em; text-transform:uppercase;
    background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    padding:9px 14px; border-radius:7px; cursor:pointer; white-space:nowrap; transition:.15s;
  }
  .tab-btn.active{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .tab-btn:not(.active):hover{ border-color:var(--accent); color:var(--ink); }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:20px; }
  .panel h2{ margin:0 0 4px; font-size:16px; }
  .panel .hint{ color:var(--ink-soft); font-size:13px; margin:0 0 16px; }

  /* Form */
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid .full{ grid-column:1/-1; }
  label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); display:block; margin-bottom:5px;}
  input,select{
    width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:7px;
    font-family:var(--sans); font-size:16px; background:#FCFBF8; color:var(--ink);
    -webkit-appearance:none; appearance:none;
  }
  input:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  input[readonly]{ background:#F1EFE8; color:var(--ink-soft); font-family:var(--mono); }

  .btn{
    font-family:var(--sans); font-weight:600; font-size:13.5px; border:none; border-radius:7px;
    padding:11px 18px; cursor:pointer; transition:.15s; display:inline-flex; align-items:center; gap:7px;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-deep); color:#fff; }
  .btn-dark{ background:var(--ink); color:#fff; }
  .btn-dark:hover{ opacity:.85; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn-ghost:hover{ border-color:var(--ink); }
  .btn-sm{ padding:6px 10px; font-size:12px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .row-actions{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }

  /* Scanner modal */
  .scan-overlay{
    position:fixed; inset:0; background:rgba(15,18,24,.88); display:none;
    align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .scan-overlay.open{ display:flex; }
  .scan-box{ background:var(--surface); border-radius:12px; padding:16px; max-width:440px; width:100%; }
  .scan-box h3{ margin:0 0 10px; font-size:15px; }
  #scanner-viewport{ position:relative; width:100%; aspect-ratio:4/3; background:#000; border-radius:8px; overflow:hidden; }
  #scanner-viewport video, #scanner-viewport canvas{ width:100%!important; height:100%!important; object-fit:cover; position:absolute; top:0; left:0;}
  .scan-status{ font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); margin:10px 0; min-height:16px;}
  .manual-row{ display:flex; gap:8px; margin-top:6px; }
  .manual-row input{ flex:1; }

  /* Item card list (Comprar / Verificar) */
  .code-display{
    font-family:var(--mono); font-size:15px; background:#F1EFE8; border:1px dashed var(--line);
    border-radius:7px; padding:9px 12px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;
  }
  .code-display .tagnum{ color:var(--accent-deep); font-weight:700; }
  .list{ margin-top:18px; display:flex; flex-direction:column; gap:8px; max-height:340px; overflow:auto; }
  .item-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13.5px; background:#FCFBF8;
  }
  .item-row .meta{ display:flex; flex-direction:column; gap:2px; }
  .item-row .meta .tg{ font-family:var(--mono); font-weight:700; color:var(--accent-deep); font-size:12.5px; }
  .badge{ font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; padding:3px 8px; border-radius:20px; font-weight:700; }
  .badge.comprado{ background:#EFE6D8; color:#7A5B22; }
  .badge.verificado{ background:var(--success-bg); color:var(--success); }
  .badge.facturado{ background:#E4E9F5; color:#33488C; }
  .badge.abonada{ background:#F3E8FA; color:#7A2FA3; }
  .badge.pagado{ background:#DCF3E3; color:#1F7A3D; }
  .badge.nomatch{ background:var(--danger-bg); color:var(--danger); }
  .badge.abierto{ background:#EFE6D8; color:#7A5B22; }
  .badge.enviado{ background:#E4E9F5; color:#33488C; }
  .badge.en_cucuta{ background:#FCEFD9; color:#8A5B12; }
  .badge.entregado{ background:#DCF3E3; color:#1F7A3D; }

  /* Table (Inventario) */
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding:8px 8px; border-bottom:1px solid var(--line); }
  td{ padding:7px 8px; border-bottom:1px solid #EFEAE0; vertical-align:middle; }
  td input, td select{ padding:6px 7px; font-size:16px; }
  .filters{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .filters input, .filters select{ width:auto; min-width:150px; }
  .tbl-wrap{ overflow-x:auto; }
  .del-btn{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:15px; padding:2px 6px; }

  /* Facturar */
  .invoice{ border:1px solid var(--line); border-radius:8px; padding:18px; margin-top:16px; background:#FCFBF8; }
  .invoice-total{ display:flex; justify-content:flex-end; font-family:var(--mono); font-size:18px; font-weight:700; margin-top:10px; padding-top:10px; border-top:1.5px dashed var(--line); }
  .empty{ color:var(--ink-soft); font-size:13.5px; padding:20px 0; text-align:center; }

  @media print{
    body *{ visibility:hidden; }
    #invoice-box, #invoice-box *{ visibility:visible; }
    #invoice-box{ position:absolute; left:0; top:0; width:100%; border:none; }
    .no-print{ display:none!important; }
    body{ background:#fff; }
  }
  @media (max-width:640px){
    .grid{ grid-template-columns:1fr; }
    .stats{ gap:12px; }
  }
  @media (min-width:768px){
    .wrap{ max-width:1440px; padding-left:32px; padding-right:32px; }
    #tab-inventario table{ font-size:13.5px; }
    #tab-inventario .tbl-wrap{ overflow-x:visible; }
    #tab-inventario th, #tab-inventario td{ padding:9px 10px; white-space:nowrap; }
    #tab-inventario td:nth-child(3){ white-space:normal; } /* descripción sí puede partirse en varias líneas */
  }
  /* ---------- Layout de módulos (sidebar) ---------- */
  .app-shell{ display:flex; gap:20px; align-items:flex-start; }
  .sidebar{
    flex-shrink:0; width:190px; display:flex; flex-direction:column; gap:4px;
    position:sticky; top:20px;
  }
  .sidebar-btn{
    display:flex; align-items:center; gap:10px; text-align:left;
    background:transparent; border:1px solid transparent; border-radius:8px;
    padding:11px 12px; font-family:var(--sans); font-weight:600; font-size:13.5px;
    color:var(--ink-soft); cursor:pointer; transition:.15s;
  }
  .sidebar-btn .ic{ font-size:16px; width:20px; text-align:center; }
  .sidebar-btn:hover{ background:#F1F1F6; color:var(--ink); }
  .sidebar-btn.active{ background:var(--accent); color:#fff; }
  .main-content{ flex:1; min-width:0; }
  .subtabs{ display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; padding-bottom:2px; }
  .subtab-btn{
    font-family:var(--sans); font-size:12.5px; font-weight:600;
    background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    padding:8px 13px; border-radius:7px; cursor:pointer; white-space:nowrap; transition:.15s;
  }
  .subtab-btn.active{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .subtab-btn:not(.active):hover{ border-color:var(--accent); color:var(--ink); }
  @media (max-width:900px){
    .app-shell{ flex-direction:column; }
    .sidebar{
      width:100%; flex-direction:row; overflow-x:auto; position:static;
      border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:4px;
    }
    .sidebar-btn{ flex-shrink:0; }
  }

  /* ---------- Clientes ---------- */
  .client-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:13.5px;
  }
  .client-row .name{ font-weight:700; }
  .client-row .meta{ color:var(--ink-soft); font-size:12px; }

  /* ---------- Facturas: repositorio ---------- */
  .factura-row{
    display:grid; grid-template-columns:100px 1fr 130px 110px 90px 90px; gap:10px; align-items:center;
    border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:13px; cursor:pointer;
  }
  .factura-row:hover{ border-color:var(--accent); }
  .factura-row.selected{ border-color:var(--accent); background:#F3F3FA; }
  @media (max-width:700px){ .factura-row{ grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<div class="scan-overlay" id="login-overlay" style="display:flex;">
  <div class="scan-box" style="max-width:360px;">
    <h3 style="text-align:center; margin-bottom:4px;">UyParceShopper System</h3>
    <p class="hint" style="text-align:center; margin-bottom:16px;">Inicia sesión para continuar</p>
    <div class="grid">
      <div class="full"><label>Correo</label><input id="login-email" type="email" autocomplete="username" placeholder="tucorreo@gmail.com"></div>
      <div class="full"><label>Contraseña</label><input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    </div>
    <div id="login-status" class="scan-status"></div>
    <div class="row-actions" style="margin-top:10px;">
      <button class="btn btn-dark" id="btn-login" style="width:100%; justify-content:center;">Iniciar sesión</button>
    </div>
    <div class="row-actions" style="margin-top:4px;">
      <button class="btn btn-ghost btn-sm" id="btn-olvide-password" style="width:100%; justify-content:center;">¿Olvidaste tu contraseña?</button>
    </div>
  </div>
</div>

<div class="wrap" style="max-width:1440px; display:none;" id="app-wrap">

  <div class="tag-header">
    <div class="brand">
      <div class="brand-mark">
        <img id="header-logo" alt="UyParce" style="width:100%; height:100%; object-fit:contain;">
      </div>
      <div>
        <h1>UyParceShopper System</h1>
        <p>Control de compras, separación y facturación</p>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
      <div id="usuario-actual" class="no-print" style="font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:8px;"></div>
      <div class="stats" id="stats-bar"></div>
    </div>
  </div>

  <div class="app-shell">
    <div class="sidebar no-print">
      <button class="sidebar-btn active" data-module="inventario"><span class="ic">📦</span> Inventario</button>
      <button class="sidebar-btn" data-module="clientes"><span class="ic">👥</span> Clientes</button>
      <button class="sidebar-btn" data-module="facturas"><span class="ic">🧾</span> Facturas</button>
      <button class="sidebar-btn" data-module="envios"><span class="ic">🚚</span> Envíos</button>
      <button class="sidebar-btn" data-module="stats"><span class="ic">📊</span> Stats</button>
      <button class="sidebar-btn" data-module="usuarios" id="sidebar-btn-usuarios" style="display:none;"><span class="ic">🔑</span> Usuarios</button>
      <button class="sidebar-btn" data-module="papelera" id="sidebar-btn-papelera" style="display:none;"><span class="ic">🗑</span> Papelera</button>
    </div>

    <div class="main-content">

      <!-- ===== MÓDULO: INVENTARIO ===== -->
      <div id="module-inventario">
        <div class="subtabs no-print">
          <button class="subtab-btn active" data-inv-sub="comprar">1 · Comprar</button>
          <button class="subtab-btn" data-inv-sub="verificar">2 · Verificar</button>
          <button class="subtab-btn" data-inv-sub="productos">3 · Productos</button>
        </div>
        <div id="tab-comprar" class="panel"></div>
        <div id="tab-verificar" class="panel" style="display:none"></div>
        <div id="tab-inventario" class="panel" style="display:none"></div>
      </div>

      <!-- ===== MÓDULO: CLIENTES ===== -->
      <div id="module-clientes" style="display:none">
        <div class="subtabs no-print">
          <button class="subtab-btn active" data-cli-sub="registrar">Registrar cliente</button>
          <button class="subtab-btn" data-cli-sub="basedatos">Base de datos</button>
        </div>
        <div id="tab-clientes-registrar" class="panel"></div>
        <div id="tab-clientes-bd" class="panel" style="display:none"></div>
      </div>

      <!-- ===== MÓDULO: FACTURAS ===== -->
      <div id="module-facturas" style="display:none">
        <div class="subtabs no-print">
          <button class="subtab-btn active" data-fac-sub="generar">Generar</button>
          <button class="subtab-btn" data-fac-sub="repositorio">Repositorio</button>
          <button class="subtab-btn" data-fac-sub="buscar">Buscar</button>
        </div>
        <div id="tab-facturar" class="panel"></div>
        <div id="tab-facturas-repo" class="panel" style="display:none"></div>
        <div id="tab-facturas-buscar" class="panel" style="display:none"></div>
      </div>

      <!-- ===== MÓDULO: ENVÍOS ===== -->
      <div id="module-envios" style="display:none">
        <div class="subtabs no-print">
          <button class="subtab-btn active" data-env-sub="crear">1 · Crear caja</button>
          <button class="subtab-btn" data-env-sub="empacar">2 · Empacar</button>
          <button class="subtab-btn" data-env-sub="recibir">3 · Recibir en Cúcuta</button>
          <button class="subtab-btn" data-env-sub="repositorio">4 · Repositorio</button>
        </div>
        <div id="tab-envios-crear" class="panel"></div>
        <div id="tab-envios-empacar" class="panel" style="display:none"></div>
        <div id="tab-envios-recibir" class="panel" style="display:none"></div>
        <div id="tab-envios-repo" class="panel" style="display:none"></div>
      </div>

      <!-- ===== MÓDULO: STATS ===== -->
      <div id="module-stats" style="display:none">
        <div id="tab-stats" class="panel"></div>
      </div>

      <!-- ===== MÓDULO: USUARIOS (solo admin) ===== -->
      <div id="module-usuarios" style="display:none">
        <div id="tab-usuarios" class="panel"></div>
      </div>

      <!-- ===== MÓDULO: PAPELERA (solo admin) ===== -->
      <div id="module-papelera" style="display:none">
        <div id="tab-papelera" class="panel"></div>
      </div>

    </div>
  </div>

</div>

<div class="scan-overlay no-print" id="scan-overlay">
  <div class="scan-box">
    <h3 id="scan-title">Escanear código de barras</h3>
    <div id="scanner-viewport">
      <img id="scan-preview" style="display:none; width:100%; height:100%; object-fit:cover;">
      <div id="scan-placeholder" style="color:#8a8f99; height:100%; display:flex; align-items:center; justify-content:center; text-align:center; padding:16px; font-size:13px;">
        Toca "Tomar foto" y enfoca el código de barras de cerca, con buena luz.
      </div>
    </div>
    <div class="scan-status" id="scan-status"></div>
    <input type="file" id="scan-file-input" accept="image/*" capture="environment" style="display:none">
    <div class="row-actions" style="margin-top:10px;">
      <button class="btn btn-primary btn-sm" id="btn-take-photo">📷 Tomar foto</button>
    </div>
    <div class="manual-row">
      <input type="text" id="manual-code" placeholder="O escribe el código manualmente">
      <button class="btn btn-primary btn-sm" id="manual-use-btn">Usar</button>
    </div>
    <div class="row-actions">
      <button class="btn btn-ghost btn-sm" id="scan-close-btn">Cerrar</button>
    </div>
  </div>
</div>

<script>
/* ---------- Configuración de Firebase ----------
   1) Crea un proyecto gratis en https://console.firebase.google.com
   2) Activa "Firestore Database" (modo producción) y "Authentication" > método "Anónimo"
   3) Ve a Configuración del proyecto > tus apps > Web (</>) y copia el objeto de config aquí abajo */
const firebaseConfig = {
  apiKey: "AIzaSyAifB2X3k6psqoBcYzJEQ1OqMiXYplQEjs",
  authDomain: "uyparceshopper.firebaseapp.com",
  projectId: "uyparceshopper",
  storageBucket: "uyparceshopper.firebasestorage.app",
  messagingSenderId: "758686990848",
  appId: "1:758686990848:web:1d4aa5dc100e28ab71cee5"
};
let db = null;
let cloudReady = false;
let cleanupConfig = null; // { autoCleanup: bool, lastAutoCleanup: ISOString } — limpieza semanal de pagados
let cleanupConfigReady = false;

// Todo el negocio se reporta en hora de Colombia (UTC-5 fija, sin horario de verano),
// sin importar si quien abre la app está en Colombia o en New Jersey (que sí cambia de hora en el año).
const BOGOTA_OFFSET_MS = 5 * 60 * 60 * 1000;
function bogotaParts(instant){
  const shifted = new Date((instant instanceof Date ? instant.getTime() : Date.now()) - BOGOTA_OFFSET_MS);
  return { y: shifted.getUTCFullYear(), m: shifted.getUTCMonth(), d: shifted.getUTCDate(), dow: shifted.getUTCDay() };
}
function mondayOfCurrentWeek(){
  const { y, m, d, dow } = bogotaParts();
  const diff = (dow === 0 ? -6 : 1) - dow; // días hasta el lunes de esta semana
  // medianoche de Bogotá de ese lunes, expresada como el instante UTC real equivalente (+5h)
  return new Date(Date.UTC(y, m, d + diff, 5, 0, 0, 0));
}
function startOfTodayBogota(){
  const { y, m, d } = bogotaParts();
  // medianoche de Bogotá de hoy, expresada como el instante UTC real equivalente (+5h)
  return new Date(Date.UTC(y, m, d, 5, 0, 0, 0));
}

/* ---------- Limpieza semanal del inventario (archivar pagados) ---------- */
async function limpiarPagadosManual(){
  const pagados = ITEMS.filter(i=>i.estado==='pagado');
  if(pagados.length===0){ alert('No hay productos pagados para limpiar ahora mismo.'); return; }
  if(!confirm(`¿Archivar ${pagados.length} producto(s) ya pagados? Salen de la vista de Inventario, pero siguen disponibles en Stats/Historial.`)) return;
  await archivarPagados(pagados);
  alert('Listo, se archivaron ' + pagados.length + ' producto(s).');
}
async function archivarPagados(pagados){
  if(!cloudReady || pagados.length===0) return;
  const batch = db.batch();
  pagados.forEach(it=>{
    const { id, ...data } = it;
    batch.set(db.collection('items_archivo').doc(id), data);
    batch.delete(db.collection('items').doc(id));
  });
  await batch.commit();
}
async function toggleAutoCleanup(checked){
  const nuevoConfig = Object.assign({}, cleanupConfig, { autoCleanup: checked });
  if(cloudReady && cleanupConfigReady){
    try{ await db.collection('settings').doc('cleanupConfig').set(nuevoConfig, { merge:true }); }
    catch(e){ console.error(e); alert('No se pudo guardar el cambio. Si el problema persiste, contacta a un administrador.'); }
  } else { cleanupConfig = nuevoConfig; renderInventario(); }
}
async function revisarLimpiezaAutomatica(){
  if(!cleanupConfig || !cleanupConfig.autoCleanup || !cloudReady) return;
  const ws = mondayOfCurrentWeek();
  const last = cleanupConfig.lastAutoCleanup ? new Date(cleanupConfig.lastAutoCleanup) : null;
  if(last && last >= ws) return; // ya se hizo la limpieza de esta semana
  const pagados = ITEMS.filter(i=>i.estado==='pagado');
  if(pagados.length > 0) await archivarPagados(pagados);
  try{
    await db.collection('settings').doc('cleanupConfig').set(
      Object.assign({}, cleanupConfig, { lastAutoCleanup: new Date().toISOString() }), { merge:true }
    );
  }catch(e){ console.warn('No se pudo actualizar la fecha de limpieza automática:', e.message); }
}

function uid(){ return 'it_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(str){
  // Escapa cualquier texto antes de insertarlo en la página, para que no se pueda
  // "inyectar" código HTML/JavaScript escribiéndolo en un campo como descripción o cliente.
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}
function normalizarCodigo(code){
  // Un mismo código de barras a veces se lee como UPC (12 dígitos) y otras como
  // EAN-13 (13 dígitos, con un cero extra al inicio). Quitamos los ceros iniciales
  // para que ambas lecturas se reconozcan como el mismo código.
  const limpio = String(code||'').trim().replace(/^0+/, '');
  return limpio || '0';
}
function localDateKey(iso){
  if(!iso) return null;
  const { y, m, d } = bogotaParts(new Date(iso));
  return y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
}
function nextTag(){
  const n = ITEMS.length + 1;
  return 'T-' + String(n).padStart(4,'0');
}

  if(!currentUser) return;
  clearTimeout(temporizadorInactividad);

    alert('Tu sesión se cerró automáticamente por inactividad (30 minutos). Vuelve a iniciar sesión.');

async function loadItems(){
  try{
    db.collection('items').onSnapshot(snapshot => {
      const _todosItems = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      ITEMS = _todosItems.filter(it => !it.eliminado);
      ITEMS_PAPELERA = _todosItems.filter(it => it.eliminado);
      cloudReady = true;
      setConnBanner('☁️ Conectado — los cambios se sincronizan con todos los dispositivos', true);
      renderAll();
      ITEMS.filter(it => (!it.precioVenta || it.precioVenta === 0) && it.precioCompra > 0)
        .forEach(it => updateItemRemote(it.id, { precioVenta: it.precioCompra }));
      revisarLimpiezaAutomatica();
    }, err => {
      console.error(err);
      setConnBanner('⚠️ Error de conexión con la nube. Revisa tu internet o intenta recargar la página.', false);
    });
    // items_archivo YA NO se carga siempre — crece sin límite con el tiempo (todo lo pagado, para siempre).
    // Se carga solo bajo demanda: al entrar a Papelera, Stats, o filtrar "Pagado" en Inventario.
    // Ver cargarArchivoSiNecesario().
    db.collection('clientes').onSnapshot(snapshot => {
      const _todosClientes = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      CLIENTES = _todosClientes.filter(c => !c.eliminado);
      CLIENTES_PAPELERA = _todosClientes.filter(c => c.eliminado);
      renderAll();
    }, err => console.warn('No se pudo leer clientes:', err.message));
    const hace14dias = new Date(Date.now() - 14*24*60*60*1000).toISOString();
    db.collection('facturas').where('fecha','>=',hace14dias).where('pagada','==',false).onSnapshot(snapshot => {
      const _todasFacturas = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      FACTURAS = _todasFacturas.filter(f => !f.eliminado);
      FACTURAS_PAPELERA = _todasFacturas.filter(f => f.eliminado);
      erroresCargaFacturas = null;
      renderAll();
    }, err => {
      console.error(err);
      erroresCargaFacturas = err.message;
      renderAll();
    });
    db.collection('envios').where('estado','in',['abierto','enviado','en_cucuta']).onSnapshot(snapshot => {
      const _todosEnvios = snapshot.docs.map(d => ({ codigo: d.id, ...d.data() }));
      ENVIOS = _todosEnvios.filter(e => !e.eliminado);
      ENVIOS_PAPELERA = _todosEnvios.filter(e => e.eliminado);
      renderAll();
    }, err => console.warn('No se pudo leer envíos:', err.message));
    db.collection('settings').doc('cleanupConfig').onSnapshot(snap => {
      if(snap.exists){ cleanupConfig = snap.data(); }
      else {
        cleanupConfig = { autoCleanup: false, lastAutoCleanup: null };
        db.collection('settings').doc('cleanupConfig').set(cleanupConfig).catch(()=>{});
      }
      cleanupConfigReady = true;
      renderInventario();
      revisarLimpiezaAutomatica();
    }, err => {
      console.warn('No se pudo leer la configuración de limpieza:', err.message);
      cleanupConfig = cleanupConfig || { autoCleanup: false, lastAutoCleanup: null };
      cleanupConfigReady = false;
      renderInventario();
    });
  }catch(e){
    console.error(e);
    setConnBanner('⚠️ No se pudo conectar a Firebase. Revisa firebaseConfig.', false);
    renderAll();
  }
}

function nextInvoiceNumberLocal(){
  let max = 0;
  [...ITEMS, ...ARCHIVO, ...FACTURAS.map(f=>({facturaNumero:f.numero}))].forEach(it=>{
    if(it.facturaNumero){
      const d = parseInt(String(it.facturaNumero).replace(/\D/g,''), 10);
      if(d > max) max = d;
    }
  });
  return 'FAC' + String(max + 1).padStart(4,'0');
}
async function batchUpdateEstado(ids, estado, extra){
  if(!cloudReady){ alert('Todavía no hay conexión con la nube.'); return; }
  const batch = db.batch();
  const changes = Object.assign({ estado }, extra || {});
  ids.forEach(id => batch.update(db.collection('items').doc(id), changes));

/* ---------- Beep ---------- */
function beep(ok=true){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = ok ? 880 : 220;
    g.gain.value = 0.08;
    o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, 130);
  }catch(e){}
}

/* ---------- Escáner (foto + Quagga.decodeSingle) ----------
   Nota: dentro de este chat, el navegador no siempre da permiso de video en vivo
   a la página, así que en vez de video continuo, se toma una foto con la cámara
   nativa del teléfono (input file con capture) y se decodifica esa imagen. Esto
   es más confiable en cualquier celular. */
function openScanner(mode){
  scanMode = mode;
  document.getElementById('scan-title').textContent =
    mode === 'comprar' ? 'Escanear prenda comprada' : 'Verificar prenda en casa';
  document.getElementById('scan-status').textContent = '';
  document.getElementById('manual-code').value = '';
  document.getElementById('scan-preview').style.display = 'none';
  document.getElementById('scan-placeholder').style.display = 'flex';
  document.getElementById('scan-overlay').classList.add('open');
}
function closeScanner(){
  document.getElementById('scan-overlay').classList.remove('open');
}
document.getElementById('btn-take-photo').addEventListener('click', ()=>{
  document.getElementById('scan-file-input').click();
});
function resizeImageForDecode(dataUrl, maxDim, cb){
  const img = new Image();
  img.onload = ()=>{
    let w = img.width, h = img.height;
    if(w > maxDim || h > maxDim){
      const scale = maxDim / Math.max(w, h);
      w = Math.round(w * scale); h = Math.round(h * scale);
    }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    cb(canvas.toDataURL('image/jpeg', 0.85));
  };
  img.onerror = ()=> cb(dataUrl);
  img.src = dataUrl;
}
document.getElementById('scan-file-input').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('scan-status');
  statusEl.textContent = 'Procesando foto…';
  const reader = new FileReader();
  reader.onload = (ev)=>{
    resizeImageForDecode(ev.target.result, 1200, (resizedUrl)=>{
      const preview = document.getElementById('scan-preview');
      preview.src = resizedUrl;
      preview.style.display = 'block';
      document.getElementById('scan-placeholder').style.display = 'none';
      decodePhoto(resizedUrl);
    });
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});
function decodePhoto(dataUrl){
  const statusEl = document.getElementById('scan-status');
  if(typeof Quagga === 'undefined'){
    statusEl.textContent = 'No se pudo cargar el lector automático. Escribe el código abajo.';
    return;
  }
  statusEl.textContent = 'Leyendo código…';
  Quagga.decodeSingle({
    src: dataUrl,
    numOfWorkers: 0,
    inputStream: { size: 1000 },
    locator: { patchSize: 'large', halfSample: false },
    decoder: { readers: ['code_128_reader','ean_reader','ean_8_reader','upc_reader','upc_e_reader','code_39_reader'] }
  }, function(result){
    if(result && result.codeResult && result.codeResult.code){
      statusEl.textContent = 'Código detectado: ' + result.codeResult.code;
      handleScannedCode(result.codeResult.code);
    } else {
      statusEl.textContent = 'No se pudo leer el código en esa foto. Intenta de nuevo más cerca y con buena luz, o escríbelo abajo.';
    }
  });
}
document.getElementById('manual-use-btn').addEventListener('click', ()=>{
  const v = document.getElementById('manual-code').value.trim();
  if(v){ handleScannedCode(v); }
});
document.getElementById('scan-close-btn').addEventListener('click', closeScanner);

function handleScannedCode(code){
  beep(true);
  document.getElementById('scan-overlay').classList.remove('open');
  if(scanMode === 'comprar') fillCompraForm(code);
  else if(scanMode === 'verificar') runVerificacion(code);
}

let pendingBarcode = '';

  el.innerHTML = `

    <p class="hint">Escanea el código de barras de la prenda y asígnale un tag antes de guardarla.</p>
    <button class="btn btn-primary" id="btn-open-scan-comprar">📷 Escanear código</button>
    <div style="margin-top:16px;">
      <div class="code-display" id="compra-code-display" style="display:${pendingBarcode ? 'flex':'none'}">
        <span>Código escaneado: <strong>${pendingBarcode}</strong></span>
      </div>
      <div class="grid">
        <div><label>Tag / etiqueta</label><input id="f-tag" value="${nextTag()}"></div>
        <div><label>Código de barras (lector físico o escribe)</label><input id="f-barcode" value="${pendingBarcode}" placeholder="Esperando escaneo..." autocomplete="off"></div>
        <div><label>Descripción de la prenda</label><input id="f-desc" placeholder="Ej: Camisa Nike azul"></div>
        <div><label>Talla</label><input id="f-talla" placeholder="Ej: M"></div>
        <div class="full">
          <label>Tipo de cliente</label>
          <select id="f-tipo-cliente">
            <option value="">Sin asignar todavía</option>
            <option value="mayorista_avanzado">Mayorista Avanzado (+20% · USD)</option>
            <option value="mayorista_parcero">Mayorista Parcero (+25% · USD)</option>
            <option value="detal">Detal (sin comisión · COP)</option>
          </select>
        </div>
        <div><label id="f-precio-compra-label">Precio de compra (USD)</label><input id="f-precio-compra" type="number" step="0.01" placeholder="0.00"></div>
        <div><label>Cliente (opcional, se puede asignar luego)</label><input id="f-cliente" list="clientes-list" placeholder="Nombre del cliente"></div>
        <div>
          <label>Tipo de compra</label>
          <select id="f-tipo-compra">
            <option value="fisica" selected>Tienda física</option>
            <option value="online">Online (pedido, aún no llega)</option>
          </select>
        </div>
      </div>
      <div class="row-actions">
        <button class="btn btn-dark" id="btn-guardar-compra">Guardar prenda</button>
        <button class="btn btn-ghost" id="btn-limpiar-compra">Limpiar</button>
      </div>
    </div>
    <div class="list" id="compra-recent"></div>
  `;
  document.getElementById('btn-open-scan-comprar').addEventListener('click', ()=>openScanner('comprar'));
  document.getElementById('btn-guardar-compra').addEventListener('click', guardarCompra);
  document.getElementById('btn-limpiar-compra').addEventListener('click', ()=>{ pendingBarcode=''; renderComprar(); });
  document.getElementById('f-tipo-cliente').addEventListener('change', e=>{
    const moneda = monedaDe(e.target.value) || 'USD';
    document.getElementById('f-precio-compra-label').textContent = `Precio de compra (${moneda})`;
  });
  document.getElementById('f-barcode').addEventListener('keydown', e=>{
    if(e.key === 'Enter'){
      e.preventDefault();
      beep(true);
      document.getElementById('f-desc').focus();
    }
  });
  if(pendingBarcode){ document.getElementById('f-desc').focus(); }
  else { document.getElementById('f-barcode').focus(); }
  renderRecentList('compra-recent');
}
function fillCompraForm(code){
  pendingBarcode = code;
  renderComprar();
}
async function guardarCompra(){
  const tag = document.getElementById('f-tag').value.trim();
  const barcode = normalizarCodigo(document.getElementById('f-barcode').value.trim());
  const desc = document.getElementById('f-desc').value.trim();
  const talla = document.getElementById('f-talla').value.trim();
  const precioCompra = parseFloat(document.getElementById('f-precio-compra').value) || 0;
  const cliente = document.getElementById('f-cliente').value.trim();
  const tipoCliente = document.getElementById('f-tipo-cliente').value;
  const tipoCompra = document.getElementById('f-tipo-compra').value;
  if(!tag || !desc){ alert('Completa al menos el tag y la descripción de la prenda.'); return; }
  // el precio de venta arranca igual al de compra (mismo número, misma moneda: el campo de compra
  // ya se ingresa en la moneda correcta según el tipo de cliente elegido). Sigue siendo editable después.
  const ventaInicial = precioCompra;
  const nuevoItem = {
    id: uid(), tag, barcode, descripcion: desc, talla,
    precioCompra, precioVenta: ventaInicial, cliente, tipoCliente, tipoCompra, estado: 'comprado',
    fecha: new Date().toISOString()
  };
  await addItemRemote(nuevoItem);
  pendingBarcode = '';
  renderAll();
}
function renderRecentList(containerId){
  const container = document.getElementById(containerId);
  if(!container) return;
  const recent = [...ITEMS].sort((a,b)=> new Date(b.fecha||0) - new Date(a.fecha||0)).slice(0, 5);
  if(recent.length === 0){ container.innerHTML = '<p class="empty">Aún no hay prendas registradas.</p>'; return; }
  container.innerHTML = recent.map(it => `
    <div class="item-row">
      <div class="meta">
        <span class="tg">${esc(it.tag)}</span>
        <span>${esc(it.descripcion)}${it.talla ? ' · '+esc(it.talla) : ''}</span>
      </div>
      <span class="badge ${it.estado}">${it.estado}</span>
    </div>
  `).join('');
}

let lastVerifyResult = null;
function renderVerificar(){
  const el = document.getElementById('tab-verificar');
  const comprados = ITEMS.filter(i=>i.estado==='comprado').length;

function renderVerifyResult(){
  const box = document.getElementById('verify-result');
  if(!box) return;
  if(!lastVerifyResult){ box.innerHTML=''; return; }
  if(lastVerifyResult.match){
    const it = lastVerifyResult.item;
    box.innerHTML = `<div class="code-display" style="border-color:var(--success); background:var(--success-bg); flex-direction:column; align-items:flex-start; gap:4px;">
      <div>✅ Coincide — <span class="tagnum">${esc(it.tag)}</span> · ${esc(it.descripcion)}${it.talla ? ' · '+esc(it.talla):''}</div>
      <div style="font-size:16px; font-weight:700;">👤 Cliente: ${it.cliente ? esc(it.cliente) : '<span style="color:var(--danger); font-weight:400;">Sin asignar todavía</span>'}</div>
      <div style="font-size:12.5px; color:var(--ink-soft);">Tipo: ${it.tipoCliente ? TIPOS_CLIENTE[it.tipoCliente].label : 'Sin asignar todavía'}</div>
    </div>`;
  } else {
    box.innerHTML = `<div class="code-display" style="border-color:var(--danger); background:var(--danger-bg);">
      ⚠️ No se encontró ninguna compra con el código <strong>${lastVerifyResult.code}</strong>. Revisa si fue registrada.
    </div>`;
  }
}
async function runVerificacion(code){
  const item = ITEMS.find(i => i.barcode && normalizarCodigo(i.barcode) === normalizarCodigo(code) && !i.fechaVerificacion);
  if(item){
    const fechaVerificacion = new Date().toISOString();
    const cambios = { fechaVerificacion };
    if(item.estado === 'comprado') cambios.estado = 'verificado'; // solo avanza el estado si aún no se había facturado (pedido online ya facturado sin llegar)
    await updateItemRemote(item.id, cambios);
    lastVerifyResult = { match:true, item: { ...item, ...cambios } };
  } else {
    beep(false);
    lastVerifyResult = { match:false, code };
  }
  renderAll();
}
function renderVerifyList(){
  const container = document.getElementById('verify-list');
  if(!container) return;
  const pending = ITEMS.filter(i=>!i.fechaVerificacion).sort((a,b)=> new Date(b.fecha||0) - new Date(a.fecha||0));
  if(pending.length===0){ container.innerHTML = '<p class="empty">No hay prendas pendientes por verificar.</p>'; return; }
  container.innerHTML = pending.map(it => `

  `).join('');
}

  catch(e){ return '—'; }
}
function fmtFechaCorta(iso){
  if(!iso) return '—';
  try{ return new Date(iso).toLocaleDateString('es-CO', { day:'2-digit', month:'2-digit', timeZone:'America/Bogota' }); }
  catch(e){ return '—'; }
}

function exportCSV(){
  const headers = ['tag','barcode','descripcion','talla','precioCompra','precioVenta','cliente','tipoCliente','estado','fecha','fechaVerificacion','fechaPago'];
  const rows = ITEMS.map(it => headers.map(h => `"${String(it[h]??'').replace(/"/g,'""')}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'inventario_tagout.csv'; a.click();
  URL.revokeObjectURL(url);
}

async function updateClienteRemote(id, changes){

      eliminadoPor: firebase.firestore.FieldValue.delete()

let facturaCliente = '';

let facturaEditMode = false;
let buscarFactFecha = '';

function datosClientePorNombre(nombre){
  return CLIENTES.find(c => c.nombre === nombre) || null;
}
function tipoClienteDe(nombre){
  const c = datosClientePorNombre(nombre);
  if(c && c.tipoCliente) return c.tipoCliente;
  const itemConTipo = ITEMS.find(i => i.cliente === nombre && i.tipoCliente);
  return itemConTipo ? itemConTipo.tipoCliente : null;
}
function clienteInfoHtml(nombre){
  const c = datosClientePorNombre(nombre);
  if(!c || (!c.telefono && !c.ciudad && !c.direccion)) return '';
  const partes = [];
  if(c.telefono) partes.push(esc(c.telefono));
  if(c.ciudad) partes.push(esc(c.ciudad));
  if(c.direccion) partes.push(esc(c.direccion));
  return `<div style="font-size:11.5px; color:var(--ink-soft); margin-top:2px;">${partes.join(' · ')}</div>`;
}
function slugNombre(str){
  return String(str||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'');
}
function nombreArchivoFactura(numero, cliente, fechaISO){
  const fechaStr = localDateKey(fechaISO || new Date().toISOString()) || '';
  return `${numero}_${slugNombre(cliente)}_${fechaStr}`;
}
function descargarFacturaPDF(el, nombreArchivo){
  if(!el){ alert('No se encontró la factura para descargar.'); return; }
  if(typeof html2pdf === 'undefined'){ alert('No se pudo cargar el generador de PDF. Usa el botón de Imprimir en su lugar.'); return; }
  const scrollPrevio = window.scrollY;
  window.scrollTo(0, 0);
  html2pdf().set({
    margin: 10,
    filename: (nombreArchivo || 'factura') + '.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, scrollX: 0, scrollY: 0, windowWidth: document.documentElement.scrollWidth },
    jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' }
  }).from(el).save().then(()=>{
    window.scrollTo(0, scrollPrevio);
  }).catch(e=>{
    console.error(e);

function agruparParaFactura(items){
  const map = new Map();
  items.forEach(it => {
    const key = it.descripcion + '||' + (Number(it.precioVenta)||0);
    if(!map.has(key)) map.set(key, { descripcion: it.descripcion, precio: Number(it.precioVenta)||0, tallas: {}, cantidad: 0 });
    const g = map.get(key);
    g.cantidad++;
    const t = (it.talla || '').trim();
    if(t){ g.tallas[t] = (g.tallas[t]||0) + 1; }
  });
  return [...map.values()].map(g => ({
    ...g,
    importe: g.precio * g.cantidad,
    tallaLines: Object.entries(g.tallas).map(([t,c]) => c > 1 ? `${t} (${c})` : t)
  }));
}

async function eliminarFactura(numero){
  if(!cloudReady){ alert('Todavía no hay conexión con la nube.'); return; }
  const factura = FACTURAS.find(f => f.numero === numero);
  if(!factura) return;
  const aviso = factura.pagada
    ? `Esta factura ya está marcada como PAGADA. ¿Seguro que quieres eliminarla? Sus ${factura.itemIds.length} prenda(s) volverán al inventario como comprado/verificado, sin ningún registro de pago.`
    : `¿Eliminar la factura ${numero}? Sus ${factura.itemIds.length} prenda(s) volverán al inventario (comprado o verificado, según corresponda), y quedarán disponibles para facturarse de nuevo.`;
  if(!confirm(aviso)) return;
  if(!confirm(`Última confirmación: esta acción NO se puede deshacer. ¿Eliminar definitivamente la factura ${numero}?`)) return;
  try{
    await Promise.all(factura.itemIds.map(async (id) => {
      const enArchivo = ARCHIVO.find(i => i.id === id);
      const liveItem = ITEMS.find(i => i.id === id) || enArchivo;
      if(!liveItem) return; // la prenda ya no existe (fue eliminada aparte)
      const nuevoEstado = liveItem.fechaVerificacion ? 'verificado' : 'comprado';
      if(enArchivo){
        // estaba archivada (ya pagada) — hay que devolverla a la colección activa de inventario
        const { id: _id, ...datos } = enArchivo;
        datos.estado = nuevoEstado;
        delete datos.facturaNumero; delete datos.fechaFacturado; delete datos.abono; delete datos.fechaPago;
        await db.collection('items').doc(id).set(datos);
        await db.collection('items_archivo').doc(id).delete();
      } else {
        await db.collection('items').doc(id).update({
          estado: nuevoEstado,
          facturaNumero: firebase.firestore.FieldValue.delete(),
          fechaFacturado: firebase.firestore.FieldValue.delete(),
          abono: firebase.firestore.FieldValue.delete(),
          fechaPago: firebase.firestore.FieldValue.delete()
        });
      }
    }));
    const nombreQuien = currentUserData ? currentUserData.nombre : 'desconocido';
    await db.collection('facturas').doc(numero).update({ eliminado: true, eliminadoFecha: new Date().toISOString(), eliminadoPor: nombreQuien });
    registrarAuditoria('eliminar', 'facturas', numero, `Factura eliminada (cliente: ${factura.cliente})`);
    facturaSeleccionada = null;
    renderAll();
    alert('Factura eliminada. Las prendas volvieron al inventario.');
  }catch(e){
    console.error(e);
    console.error(e); alert('No se pudo eliminar la factura por completo. Revisa el inventario antes de reintentar, o contacta a un administrador.');
  }
}

      const subtotal = nuevosItems.reduce((s,it)=>s+it.precioVenta,0);

      const abono = Math.max(parseFloat(box.querySelector('#edit-fact-abono').value) || 0, 0);

        fechaEdicion: new Date().toISOString()
      };
      await updateFacturaRemote(factura.numero, cambios);
      // reflejo inmediato en memoria, sin esperar el round-trip de la nube

      const idxLocal = FACTURAS.findIndex(f=>f.numero===factura.numero);

let buscarFactCliente = '';
let resultadosBusquedaFacturas = null; // null = sin buscar todavía; [] = sin resultados; array = resultados
let busquedaFacturasEnCurso = false;
function rangoUTCParaDiaBogota(fechaStr){
  const [y,m,d] = fechaStr.split('-').map(Number);
  return {
    inicio: new Date(Date.UTC(y, m-1, d, 5, 0, 0, 0)).toISOString(),
    fin: new Date(Date.UTC(y, m-1, d+1, 5, 0, 0, 0)).toISOString()
  };
}
async function buscarFacturasEnNube(fecha, cliente){
  if(!cloudReady) return [];
  try{
    let snap;
    if(cliente){
      snap = await db.collection('facturas').where('cliente','==',cliente).get();
    } else if(fecha){
      const { inicio, fin } = rangoUTCParaDiaBogota(fecha);
      snap = await db.collection('facturas').where('fecha','>=',inicio).where('fecha','<',fin).get();
    } else {
      return [];
    }
    let resultados = snap.docs.map(d=>({ id:d.id, ...d.data() })).filter(f=>!f.eliminado);
    if(fecha && cliente) resultados = resultados.filter(f => localDateKey(f.fecha) === fecha);
    return resultados;
  }catch(e){
    console.error(e);
    return [];
  }
}
async function ejecutarBusquedaFacturas(){
  if(!buscarFactFecha && !buscarFactCliente){ resultadosBusquedaFacturas = null; renderAll(); return; }
  busquedaFacturasEnCurso = true;
  renderAll();
  resultadosBusquedaFacturas = await buscarFacturasEnNube(buscarFactFecha, buscarFactCliente);
  busquedaFacturasEnCurso = false;
  renderAll();
}

  document.getElementById('buscar-fact-fecha').addEventListener('change', e=>{ buscarFactFecha = e.target.value; facturaSeleccionada = null; ejecutarBusquedaFacturas(); });

  el.querySelectorAll('.factura-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const numero = row.dataset.numero;
      facturaSeleccionada = (facturaSeleccionada === numero) ? null : numero;
      facturaEditMode = false;

let cajaEnEmpaque = '';
let cajaEnRecepcion = '';
let ultimoEscaneoEnvio = null; // { ok: bool, mensaje, item? } para feedback visual

async function crearCajaRemota(codigo){
  if(!cloudReady){ alert('Todavía no hay conexión con la nube.'); return false; }
  const existente = ENVIOS.find(e => e.codigo === codigo);
  if(existente){ alert('Ya existe una caja con este código: ' + codigo); return false; }
  await db.collection('envios').doc(codigo).set({
    estado: 'abierto', itemIds: [], fecha: new Date().toISOString(),
    fechaEnviado: null, fechaEnCucuta: null, fechaEntregado: null
  });
  beep(true);
  return true;
}
async function empacarProductoEnCaja(codigo, barcode){
  const item = [...ITEMS, ...ARCHIVO].find(i => i.barcode && normalizarCodigo(i.barcode) === normalizarCodigo(barcode) && !i.cajaId);
  if(!item){ beep(false); return { ok:false, mensaje:'No se encontró una prenda sin caja asignada con ese código.' }; }
  const caja = ENVIOS.find(e => e.codigo === codigo);
  if(!caja){ beep(false); return { ok:false, mensaje:'La caja ya no existe.' }; }
  await updateItemAnywhere(item.id, { cajaId: codigo });
  await db.collection('envios').doc(codigo).update({ itemIds: [...(caja.itemIds||[]), item.id] });
  beep(true);
  return { ok:true, item };
}
async function quitarProductoDeCaja(codigo, itemId){
  if(!cloudReady){ alert('Todavía no hay conexión con la nube.'); return; }
  const caja = ENVIOS.find(e => e.codigo === codigo);
  if(!caja) return;
  const nuevosIds = (caja.itemIds||[]).filter(id => id !== itemId);
  await db.collection('envios').doc(codigo).update({ itemIds: nuevosIds });
  await updateItemAnywhere(itemId, { cajaId: firebase.firestore.FieldValue.delete() });
}
async function sellarCaja(codigo){
  const caja = ENVIOS.find(e => e.codigo === codigo);
  if(!caja || (caja.itemIds||[]).length === 0){ alert('La caja está vacía, escanea al menos una prenda antes de sellarla.'); return; }
  if(!confirm(`¿Sellar y enviar la caja ${codigo} con ${caja.itemIds.length} prenda(s)? Ya no se le podrán agregar más productos.`)) return;
  const fechaEnviado = new Date().toISOString();
  await db.collection('envios').doc(codigo).update({ estado:'enviado', fechaEnviado });
  await Promise.all(caja.itemIds.map(id => updateItemAnywhere(id, { estadoEnvio:'enviado', fechaEnvioEnviado: fechaEnviado })));
  cajaEnEmpaque = '';
  renderAll();
  alert('Caja ' + codigo + ' sellada y enviada.');
}
async function recibirProductoCucuta(codigo, barcode){
  const item = [...ITEMS, ...ARCHIVO].find(i => i.barcode && normalizarCodigo(i.barcode) === normalizarCodigo(barcode) && i.cajaId === codigo);
  if(!item){ beep(false); return { ok:false, mensaje:'Ese código no pertenece a esta caja.' }; }
  if(item.estadoEnvio === 'en_cucuta'){ beep(true); return { ok:'repetido', item }; }
  await updateItemAnywhere(item.id, { estadoEnvio:'en_cucuta', fechaEnCucuta: new Date().toISOString() });
  beep(true);
  return { ok:true, item };
}
async function marcarCajaEnCucuta(codigo){
  await db.collection('envios').doc(codigo).update({ estado:'en_cucuta', fechaEnCucuta: new Date().toISOString() });
}
async function marcarItemEntregado(itemId){
  await updateItemAnywhere(itemId, { estadoEnvio:'entregado', fechaEntregado: new Date().toISOString() });
}
async function restaurarEnvioRemote(codigo){
  try{
    await db.collection('envios').doc(codigo).update({
      eliminado: firebase.firestore.FieldValue.delete(),
      eliminadoFecha: firebase.firestore.FieldValue.delete(),

async function eliminarCaja(codigo){
  if(!cloudReady){ alert('Todavía no hay conexión con la nube.'); return; }
  const caja = ENVIOS.find(e => e.codigo === codigo) || ENVIOS_ENTREGADOS.find(e => e.codigo === codigo);
  if(!caja) return;
  const cantidad = (caja.itemIds||[]).length;
  const aviso = cantidad > 0
    ? `¿Eliminar la caja ${codigo}? Sus ${cantidad} prenda(s) quedarán sin caja asignada, listas para empacarse de nuevo en otra caja.`
    : `¿Eliminar la caja vacía ${codigo}?`;
  if(!confirm(aviso)) return;
  if(!confirm(`Última confirmación: esta acción no se puede deshacer. ¿Eliminar definitivamente la caja ${codigo}?`)) return;
  try{
    await Promise.all((caja.itemIds||[]).map(id => updateItemAnywhere(id, {
      cajaId: firebase.firestore.FieldValue.delete(),
      estadoEnvio: firebase.firestore.FieldValue.delete(),
      fechaEnvioEnviado: firebase.firestore.FieldValue.delete(),
      fechaEnCucuta: firebase.firestore.FieldValue.delete(),
      fechaEntregado: firebase.firestore.FieldValue.delete()
    })));
    const nombreQuien = currentUserData ? currentUserData.nombre : 'desconocido';
    await db.collection('envios').doc(codigo).update({ eliminado: true, eliminadoFecha: new Date().toISOString(), eliminadoPor: nombreQuien });
    registrarAuditoria('eliminar', 'envios', codigo, 'Caja de envío eliminada');
    if(cajaEnEmpaque === codigo) cajaEnEmpaque = '';
    if(cajaEnRecepcion === codigo) cajaEnRecepcion = '';
    if(envioSeleccionado === codigo) envioSeleccionado = null;
    renderAll();
    alert('Caja eliminada.' + (cantidad>0 ? ' Las prendas quedaron disponibles para empacarse de nuevo.' : ''));
  }catch(e){
    console.error(e);
    console.error(e); alert('No se pudo eliminar la caja por completo. Si el problema persiste, contacta a un administrador.');
  }
}

  const caja = ENVIOS.find(e => e.codigo === codigo) || ENVIOS_ENTREGADOS.find(e => e.codigo === codigo);

async function crearUsuarioDesdeForm(){
  const nombre = document.getElementById('usr-nombre').value.trim();
  const correo = document.getElementById('usr-correo').value.trim();
  const rol = document.getElementById('usr-rol').value;
  if(!nombre || !correo){ alert('Completa el nombre y el correo.'); return; }
  if(!confirm(`¿Crear la cuenta de ${nombre} (${correo}) con rol "${rolLabel(rol)}"? Se le enviará un correo para que cree su contraseña.`)) return;
  let secondaryApp = null;
  try{
    secondaryApp = firebase.initializeApp(firebaseConfig, 'Secondary_' + Date.now());
    const tempPassword = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2) + 'Aa1!';
    const cred = await secondaryApp.auth().createUserWithEmailAndPassword(correo, tempPassword);
    const uid = cred.user.uid;
    await secondaryApp.auth().sendPasswordResetEmail(correo);
    await secondaryApp.auth().signOut();
    await db.collection('usuarios').doc(uid).set({ nombre, correo, rol, activo: true, fecha: new Date().toISOString() });
    document.getElementById('usr-nombre').value = '';
    document.getElementById('usr-correo').value = '';
    cargarUsuariosSiNecesario(true);
    alert('Cuenta creada. Se le envió un correo a ' + correo + ' para establecer su contraseña.');
  }catch(e){
    console.error(e);
    alert('No se pudo crear el usuario. Verifica el correo e inténtalo de nuevo, o contacta a un administrador.');
  }finally{
    if(secondaryApp){ try{ await secondaryApp.delete(); }catch(e){} }
  }
}

function campoIdDe(coleccion){ return coleccion === 'envios' ? 'codigo' : 'id'; }
async function restaurarBackupDesdeArchivo(file){
  if(!file) return;
  let backup;
  try{
    const texto = await file.text();
    backup = JSON.parse(texto);
  }catch(e){
    alert('Ese archivo no se pudo leer como una copia de seguridad válida (¿es el archivo .json correcto?).');
    return;
  }
  const colecciones = ['items','items_archivo','clientes','facturas','envios'];
  const resumen = colecciones.map(c => `${c}: ${Array.isArray(backup[c]) ? backup[c].length : 0}`).join('  ·  ');
  const aviso = `Este archivo fue generado el ${backup.generadoEl || '(fecha desconocida)'} por ${backup.generadoPor || 'desconocido'}.\n\nContiene: ${resumen}\n\n⚠️ Esto SOBRESCRIBE los datos actuales de cada prenda/cliente/factura/caja que exista en el archivo (no borra lo que sea nuevo y no esté en el archivo). Si algo cambió después de esa fecha en esos registros específicos, se perderá.\n\n¿Continuar con la restauración?`;
  if(!confirm(aviso)) return;
  if(!confirm('Última confirmación: esto sobrescribe datos reales y no se puede deshacer con un clic. ¿Restaurar de todas formas?')) return;
  try{
    for(const coleccion of colecciones){
      const docs = Array.isArray(backup[coleccion]) ? backup[coleccion] : [];
      const idField = campoIdDe(coleccion);
      for(let i = 0; i < docs.length; i += 400){
        const lote = docs.slice(i, i + 400);
        const batch = db.batch();
        lote.forEach(doc=>{
          const id = doc[idField];
          if(!id) return;
          batch.set(db.collection(coleccion).doc(id), doc);
        });
        await batch.commit();
      }
    }
    registrarAuditoria('restaurar_backup', 'sistema', '-', `Backup restaurado (generado el ${backup.generadoEl})`);
    alert('Copia de seguridad restaurada. Puede tardar unos segundos en reflejarse en toda la app.');
  }catch(e){
    console.error(e);
    alert('Ocurrió un error restaurando el backup. Revisa la consola antes de reintentar, algunas colecciones pudieron quedar restauradas y otras no.');
  }
}
function exportarBackupCompleto(){
  const backup = {
    generadoEl: new Date().toISOString(),
    generadoPor: currentUserData ? currentUserData.nombre : 'desconocido',
    items: [...ITEMS, ...ITEMS_PAPELERA],
    items_archivo: [...ARCHIVO, ...ARCHIVO_PAPELERA],
    clientes: [...CLIENTES, ...CLIENTES_PAPELERA],
    facturas: [...FACTURAS, ...FACTURAS_PAPELERA],
    envios: [...ENVIOS, ...ENVIOS_PAPELERA],
    usuarios: USUARIOS
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'backup_uyparceshopper_' + (localDateKey(new Date().toISOString())||'') + '.json';
  a.click();
  URL.revokeObjectURL(url);
  registrarAuditoria('backup_manual', 'sistema', '-', 'Se generó una copia de seguridad manual completa');

let statsPeriodo = 'dia'; // 'dia' | 'semana' | 'mes'

function agruparPorDiaRaw(){
  const todos = [...ITEMS, ...ARCHIVO];
  const dias = {};
  function dayKey(iso){ return localDateKey(iso); }
  function ensure(key){
    if(!dias[key]) dias[key] = { comprados:0, compraUSD:0, compraCOP:0, verificados:0, facturados:0, ventaUSD:0, ventaCOP:0, comisionUSD:0, pagados:0, recibidoUSD:0, recibidoCOP:0 };
    return dias[key];
  }
  todos.forEach(it=>{
    const kc = dayKey(it.fecha);
    if(kc){
      const d = ensure(kc); d.comprados++;
      if(monedaDe(it.tipoCliente) === 'COP'){ d.compraCOP += Number(it.precioCompra)||0; }
      else { d.compraUSD += Number(it.precioCompra)||0; }
    }
    const kv = dayKey(it.fechaVerificacion);
    if(kv) ensure(kv).verificados++;
    const kf = dayKey(it.fechaFacturado);
    if(kf){
      const d = ensure(kf); d.facturados++;
      const tipoInfo = TIPOS_CLIENTE[it.tipoCliente];
      if(monedaDe(it.tipoCliente) === 'COP'){ d.ventaCOP += Number(it.precioVenta)||0; }
      else {
        d.ventaUSD += Number(it.precioVenta)||0;
        if(tipoInfo) d.comisionUSD += (Number(it.precioVenta)||0) * tipoInfo.recargo;
      }
    }
    const kp = dayKey(it.fechaPago);
    if(kp) ensure(kp).pagados++;
  });
  // Dinero recibido: el abono se cuenta el día que se generó la factura, y el saldo restante
  // se cuenta el día en que se marcó como pagada (para no contar dos veces el mismo abono).
  (facturasCompletoCargado ? FACTURAS_TODAS_STATS : FACTURAS).forEach(f=>{
    const abono = Number(f.abono)||0;
    if(abono > 0 && f.fecha){
      const d = ensure(dayKey(f.fecha));
      if(f.moneda === 'COP') d.recibidoCOP += abono; else d.recibidoUSD += abono;
    }
    if(f.pagada && f.fechaPago){
      const saldo = f.totalPorPagar != null ? Number(f.totalPorPagar) : Math.max(Number(f.total||0) - abono, 0);
      const d = ensure(dayKey(f.fechaPago));
      if(f.moneda === 'COP') d.recibidoCOP += saldo; else d.recibidoUSD += saldo;
    }
  });
  return dias;
}
function agruparPorPeriodo(periodo){
  const base = agruparPorDiaRaw();
  if(periodo === 'dia') return Object.entries(base).sort((a,b)=> b[0].localeCompare(a[0]));
  const buckets = {};
  Object.entries(base).forEach(([day, d])=>{
    let key;
    if(periodo === 'semana'){
      const dt = new Date(day+'T00:00:00');
      const dow = dt.getDay(); const diff = (dow===0?-6:1)-dow;
      const monday = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()+diff);
      key = localDateKey(monday);
    } else {
      key = day.slice(0,7);
    }
    if(!buckets[key]) buckets[key] = { comprados:0, compraUSD:0, compraCOP:0, verificados:0, facturados:0, ventaUSD:0, ventaCOP:0, comisionUSD:0, pagados:0, recibidoUSD:0, recibidoCOP:0 };
    const b = buckets[key];
    Object.keys(b).forEach(k => b[k] += d[k]||0);
  });
  return Object.entries(buckets).sort((a,b)=> b[0].localeCompare(a[0]));
}
function fmtPeriodoLabel(key, periodo){
  if(periodo === 'dia') return new Date(key+'T05:00:00Z').toLocaleDateString('es-CO',{weekday:'short', day:'2-digit', month:'short', timeZone:'America/Bogota'});
  if(periodo === 'semana') return 'Semana de ' + new Date(key+'T05:00:00Z').toLocaleDateString('es-CO',{day:'2-digit', month:'short', timeZone:'America/Bogota'});
  const [y,m] = key.split('-');
  return new Date(Date.UTC(y, m-1, 1, 5)).toLocaleDateString('es-CO',{month:'long', year:'numeric', timeZone:'America/Bogota'});
}

          </tr>
        `).join('')}
      </tbody>

  el.querySelectorAll('[data-periodo]').forEach(btn=>{

  });
  document.getElementById('btn-actualizar-stats')?.addEventListener('click', ()=>{

/* ---------- Stats + datalist ---------- */
function renderStats(){
  const bar = document.getElementById('stats-bar');
  const ws = startOfTodayBogota();
  const enRango = (fechaStr) => !!fechaStr && new Date(fechaStr) >= ws;
  const todos = [...ITEMS, ...ARCHIVO];

  const comprados = todos.filter(i => enRango(i.fecha)).length;
  const verificados = ITEMS.filter(i => enRango(i.fechaVerificacion)).length;
  const facturados = ITEMS.filter(i => enRango(i.fechaFacturado)).length;
  const pagados = todos.filter(i => enRango(i.fechaPago)).length;
  const valorVentaUSD = ITEMS.filter(i => enRango(i.fechaFacturado) && monedaDe(i.tipoCliente)==='USD').reduce((s,i)=>s+(Number(i.precioVenta)||0),0);
  const valorVentaCOP = ITEMS.filter(i => enRango(i.fechaFacturado) && monedaDe(i.tipoCliente)==='COP').reduce((s,i)=>s+(Number(i.precioVenta)||0),0);

  bar.innerHTML = `
    <div class="stat"><div class="n">${comprados}</div><div class="l">Compradas hoy</div></div>
    <div class="stat"><div class="n">${verificados}</div><div class="l">Verificadas</div></div>
    <div class="stat"><div class="n">${facturados}</div><div class="l">Facturadas</div></div>
    <div class="stat"><div class="n">${pagados}</div><div class="l">Pagadas</div></div>
    <div class="stat"><div class="n">${fmtUSD(valorVentaUSD)}</div><div class="l">Venta mayoristas</div></div>
    <div class="stat"><div class="n">${fmtCOP(valorVentaCOP)}</div><div class="l">Venta detal</div></div>
    <div class="week-bar no-print">
      <span>📅 Hoy — se reinicia solo cada día. El detalle diario/semanal/mensual está en el módulo Stats</span>
    </div>
  `;

  let dl = document.getElementById('clientes-list');
  if(!dl){ dl = document.createElement('datalist'); dl.id='clientes-list'; document.body.appendChild(dl); }
  const clientes = [...new Set([...ITEMS.map(i=>i.cliente), ...CLIENTES.map(c=>c.nombre)].filter(Boolean))];
  dl.innerHTML = clientes.map(c=>`<option value="${esc(c)}">`).join('');
}
