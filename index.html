<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --bg:#F7F4EC;
    --surface:#FFFFFF;
    --ink:#1C2530;
    --ink-soft:#697080;
    --accent:#E1962B;
    --accent-deep:#B9721A;
    --line:#D9D2C1;
    --success:#3E7A4D;
    --success-bg:#E7F1E9;
    --danger:#B4442E;
    --danger-bg:#FBEAE5;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  }
  button{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  .wrap{max-width:920px; margin:0 auto; padding:20px 16px 80px;}

  /* Header — shipping tag motif */
  .tag-header{
    position:relative; background:var(--surface); border:1.5px dashed var(--line);
    border-radius:10px; padding:22px 22px 18px; margin-bottom:18px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .tag-header::before, .tag-header::after{
    content:""; position:absolute; top:50%; width:16px; height:16px; background:var(--bg);
    border:1.5px dashed var(--line); border-radius:50%; transform:translateY(-50%);
  }
  .tag-header::before{ left:-9px; }
  .tag-header::after{ right:-9px; }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:40px; height:40px; border-radius:8px; background:var(--ink);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-mark svg{width:24px; height:24px;}
  .brand h1{font-size:19px; margin:0; letter-spacing:-0.01em;}
  .brand p{margin:2px 0 0; font-size:12.5px; color:var(--ink-soft);}
  .stats{display:flex; gap:18px; flex-wrap:wrap;}
  .stat{text-align:right;}
  .stat .n{font-family:var(--mono); font-size:20px; font-weight:700; color:var(--accent-deep); line-height:1;}
  .stat .l{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-top:3px;}

  /* Tabs */
  .tabs{display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; padding-bottom:2px;}
  .tab-btn{
    font-family:var(--mono); font-size:12.5px; letter-spacing:.02em; text-transform:uppercase;
    background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    padding:9px 14px; border-radius:7px; cursor:pointer; white-space:nowrap; transition:.15s;
  }
  .tab-btn.active{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .tab-btn:not(.active):hover{ border-color:var(--accent); color:var(--ink); }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:20px; }
  .panel h2{ margin:0 0 4px; font-size:16px; }
  .panel .hint{ color:var(--ink-soft); font-size:13px; margin:0 0 16px; }

  /* Form */
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid .full{ grid-column:1/-1; }
  label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); display:block; margin-bottom:5px;}
  input,select{
    width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:7px;
    font-family:var(--sans); font-size:16px; background:#FCFBF8; color:var(--ink);
    -webkit-appearance:none; appearance:none;
  }
  input:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  input[readonly]{ background:#F1EFE8; color:var(--ink-soft); font-family:var(--mono); }

  .btn{
    font-family:var(--sans); font-weight:600; font-size:13.5px; border:none; border-radius:7px;
    padding:11px 18px; cursor:pointer; transition:.15s; display:inline-flex; align-items:center; gap:7px;
  }
  .btn-primary{ background:var(--accent); color:#241703; }
  .btn-primary:hover{ background:var(--accent-deep); color:#fff; }
  .btn-dark{ background:var(--ink); color:#fff; }
  .btn-dark:hover{ opacity:.85; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn-ghost:hover{ border-color:var(--ink); }
  .btn-sm{ padding:6px 10px; font-size:12px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .row-actions{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }

  /* Scanner modal */
  .scan-overlay{
    position:fixed; inset:0; background:rgba(15,18,24,.88); display:none;
    align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .scan-overlay.open{ display:flex; }
  .scan-box{ background:var(--surface); border-radius:12px; padding:16px; max-width:440px; width:100%; }
  .scan-box h3{ margin:0 0 10px; font-size:15px; }
  #scanner-viewport{ position:relative; width:100%; aspect-ratio:4/3; background:#000; border-radius:8px; overflow:hidden; }
  #scanner-viewport video, #scanner-viewport canvas{ width:100%!important; height:100%!important; object-fit:cover; position:absolute; top:0; left:0;}
  .scan-status{ font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); margin:10px 0; min-height:16px;}
  .manual-row{ display:flex; gap:8px; margin-top:6px; }
  .manual-row input{ flex:1; }

  /* Item card list (Comprar / Verificar) */
  .code-display{
    font-family:var(--mono); font-size:15px; background:#F1EFE8; border:1px dashed var(--line);
    border-radius:7px; padding:9px 12px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;
  }
  .code-display .tagnum{ color:var(--accent-deep); font-weight:700; }
  .list{ margin-top:18px; display:flex; flex-direction:column; gap:8px; max-height:340px; overflow:auto; }
  .item-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13.5px; background:#FCFBF8;
  }
  .item-row .meta{ display:flex; flex-direction:column; gap:2px; }
  .item-row .meta .tg{ font-family:var(--mono); font-weight:700; color:var(--accent-deep); font-size:12.5px; }
  .badge{ font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; padding:3px 8px; border-radius:20px; font-weight:700; }
  .badge.comprado{ background:#EFE6D8; color:#7A5B22; }
  .badge.verificado{ background:var(--success-bg); color:var(--success); }
  .badge.facturado{ background:#E4E9F5; color:#33488C; }
  .badge.pagado{ background:#DCF3E3; color:#1F7A3D; }
  .badge.nomatch{ background:var(--danger-bg); color:var(--danger); }

  /* Table (Inventario) */
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding:8px 8px; border-bottom:1px solid var(--line); }
  td{ padding:7px 8px; border-bottom:1px solid #EFEAE0; vertical-align:middle; }
  td input, td select{ padding:6px 7px; font-size:16px; }
  .filters{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .filters input, .filters select{ width:auto; min-width:150px; }
  .tbl-wrap{ overflow-x:auto; }
  .del-btn{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:15px; padding:2px 6px; }

  /* Facturar */
  .invoice{ border:1px solid var(--line); border-radius:8px; padding:18px; margin-top:16px; background:#FCFBF8; }
  .invoice-total{ display:flex; justify-content:flex-end; font-family:var(--mono); font-size:18px; font-weight:700; margin-top:10px; padding-top:10px; border-top:1.5px dashed var(--line); }
  .empty{ color:var(--ink-soft); font-size:13.5px; padding:20px 0; text-align:center; }

  @media print{
    .tabs, .tag-header, .no-print{ display:none!important; }
    body{ background:#fff; }
    .panel{ border:none; }
  }
  @media (max-width:640px){
    .grid{ grid-template-columns:1fr; }
    .stats{ gap:12px; }
  }
  @media (min-width:768px){
    .wrap{ max-width:1440px; padding-left:32px; padding-right:32px; }
    #tab-inventario table{ font-size:13.5px; }
    #tab-inventario .tbl-wrap{ overflow-x:visible; }
    #tab-inventario th, #tab-inventario td{ padding:9px 10px; white-space:nowrap; }
    #tab-inventario td:nth-child(3){ white-space:normal; } /* descripción sí puede partirse en varias líneas */
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="tag-header">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E1962B" stroke-width="2"><path d="M3 8V5a2 2 0 0 1 2-2h3l11 11-6 6L2 9V8Z"/><circle cx="7.5" cy="7.5" r="1.2" fill="#E1962B"/></svg>
      </div>
      <div>
        <h1>TagOut</h1>
        <p>Control de compras, separación y facturación</p>
      </div>
    </div>
    <div class="stats" id="stats-bar"></div>
  </div>

  <div class="tabs no-print">
    <button class="tab-btn active" data-tab="comprar">1 · Comprar</button>

</div>

      <button class="btn btn-ghost btn-sm" id="scan-close-btn">Cerrar</button>

<script>
/* ---------- Configuración de Firebase ----------
   1) Crea un proyecto gratis en https://console.firebase.google.com
   2) Activa "Firestore Database" (modo producción) y "Authentication" > método "Anónimo"
   3) Ve a Configuración del proyecto > tus apps > Web (</>) y copia el objeto de config aquí abajo */
const firebaseConfig = {
  apiKey: "AIzaSyAifB2X3k6psqoBcYzJEQ1OqMiXYplQEjs",
  authDomain: "uyparceshopper.firebaseapp.com",
  projectId: "uyparceshopper",
  storageBucket: "uyparceshopper.firebasestorage.app",
  messagingSenderId: "758686990848",
  appId: "1:758686990848:web:1d4aa5dc100e28ab71cee5"
};
let db = null;
let cloudReady = false;

/* ---------- Estado ---------- */
let ITEMS = [];
let scanMode = null; // 'comprar' | 'verificar'
let quaggaRunning = false;

function uid(){ return 'it_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nextTag(){
  const n = ITEMS.length + 1;
  return 'T-' + String(n).padStart(4,'0');
}
const TIPOS_CLIENTE = {
  mayorista_avanzado: { label: 'Mayorista Avanzado', recargo: 0.20, moneda: 'USD' },
  mayorista_parcero:  { label: 'Mayorista Parcero',  recargo: 0.25, moneda: 'USD' },
  detal:               { label: 'Detal',              recargo: 0,    moneda: 'COP' }
};
const NEGOCIO = { nombre: 'Uy Parce', telefono: '848-329-9856', correo: 'uyparcelersonalshopper@gmail.com' };
// NOTA: reservado para más adelante, cuando se calcule automáticamente el precio Detal en COP
// (incluyendo envío, tasa del dólar y demás recargos). Por ahora NO se usa: el precio Detal se ingresa manualmente.
const TASA_USD_COP = 4000;
function usdToCop(usd){ return Math.round((Number(usd)||0) * TASA_USD_COP); }
function fmtUSD(v){ return '$' + (Number(v)||0).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' USD'; }
function fmtCOP(v){ return '$' + Math.round(Number(v)||0).toLocaleString('es-CO') + ' COP'; }
function monedaDe(tipoCliente){ return TIPOS_CLIENTE[tipoCliente] ? TIPOS_CLIENTE[tipoCliente].moneda : null; }
function fmtVenta(it){ return monedaDe(it.tipoCliente) === 'COP' ? fmtCOP(it.precioVenta) : fmtUSD(it.precioVenta); }
// la compra siempre se paga en USD en el outlet; para Detal se muestra convertida a COP para llevar su contabilidad aparte
function fmtCompra(it){ return monedaDe(it.tipoCliente) === 'COP' ? fmtCOP(it.precioCompra) : fmtUSD(it.precioCompra); }
function fmtMoney(v){ return fmtUSD(v); }

function setConnBanner(text, ok){
  let b = document.getElementById('conn-banner');
  if(!b){
    b = document.createElement('div');
    b.id = 'conn-banner';
    b.style.cssText = 'text-align:center; font-family:var(--mono); font-size:11.5px; padding:6px; border-radius:6px; margin-bottom:12px;';
    document.querySelector('.wrap').prepend(b);
  }
  b.textContent = text;
  b.style.background = ok ? 'var(--success-bg)' : 'var(--danger-bg)';
  b.style.color = ok ? 'var(--success)' : 'var(--danger)';
}

async function loadItems(){
  if(firebaseConfig.apiKey === "TU_API_KEY"){
    setConnBanner('⚠️ Falta configurar Firebase — mira los comentarios en el código (firebaseConfig)', false);
    renderAll();
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    await firebase.auth().signInAnonymously();
    db.collection('items').onSnapshot(snapshot => {
      ITEMS = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      cloudReady = true;
      setConnBanner('☁️ Conectado — los cambios se sincronizan con todos los dispositivos', true);
      renderAll();
      ITEMS.filter(it => (!it.precioVenta || it.precioVenta === 0) && it.precioCompra > 0)
        .forEach(it => updateItemRemote(it.id, { precioVenta: it.precioCompra }));
    }, err => {
      console.error(err);
      setConnBanner('⚠️ Error de conexión con la nube: ' + err.message, false);
    });
  }catch(e){
    console.error(e);
    setConnBanner('⚠️ No se pudo conectar a Firebase. Revisa firebaseConfig.', false);
    renderAll();
  }
}
async function addItemRemote(item){
  if(!cloudReady){ alert('Todavía no hay conexión con la nube. Espera un momento e intenta de nuevo.'); return; }
  await db.collection('items').doc(item.id).set(item);
}
async function updateItemRemote(id, changes){
  if(!cloudReady){ alert('Todavía no hay conexión con la nube.'); return; }
  await db.collection('items').doc(id).update(changes);
}
async function deleteItemRemote(id){
  if(!cloudReady){ alert('Todavía no hay conexión con la nube.'); return; }
  await db.collection('items').doc(id).delete();
}
function nextInvoiceNumberLocal(){
  let max = 0;
  ITEMS.forEach(it=>{
    if(it.facturaNumero){
      const d = parseInt(String(it.facturaNumero).replace(/\D/g,''), 10);
      if(d > max) max = d;
    }
  });
  return 'FAC' + String(max + 1).padStart(4,'0');
}
async function batchUpdateEstado(ids, estado, extra){
  if(!cloudReady){ alert('Todavía no hay conexión con la nube.'); return; }
  const batch = db.batch();
  const changes = Object.assign({ estado }, extra || {});
  ids.forEach(id => batch.update(db.collection('items').doc(id), changes));
  await batch.commit();
}


/* ---------- Beep ---------- */
function beep(ok=true){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = ok ? 880 : 220;
    g.gain.value = 0.08;
    o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, 130);
  }catch(e){}
}

/* ---------- Escáner (foto + Quagga.decodeSingle) ----------
   Nota: dentro de este chat, el navegador no siempre da permiso de video en vivo
   a la página, así que en vez de video continuo, se toma una foto con la cámara
   nativa del teléfono (input file con capture) y se decodifica esa imagen. Esto
   es más confiable en cualquier celular. */
function openScanner(mode){
  scanMode = mode;
  document.getElementById('scan-title').textContent =
    mode === 'comprar' ? 'Escanear prenda comprada' : 'Verificar prenda en casa';
  document.getElementById('scan-status').textContent = '';
  document.getElementById('manual-code').value = '';
  document.getElementById('scan-preview').style.display = 'none';
  document.getElementById('scan-placeholder').style.display = 'flex';
  document.getElementById('scan-overlay').classList.add('open');
}
function closeScanner(){
  document.getElementById('scan-overlay').classList.remove('open');
}
document.getElementById('btn-take-photo').addEventListener('click', ()=>{
  document.getElementById('scan-file-input').click();
});
function resizeImageForDecode(dataUrl, maxDim, cb){
  const img = new Image();
  img.onload = ()=>{
    let w = img.width, h = img.height;
    if(w > maxDim || h > maxDim){
      const scale = maxDim / Math.max(w, h);
      w = Math.round(w * scale); h = Math.round(h * scale);
    }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    cb(canvas.toDataURL('image/jpeg', 0.85));
  };
  img.onerror = ()=> cb(dataUrl);
  img.src = dataUrl;
}
document.getElementById('scan-file-input').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('scan-status');
  statusEl.textContent = 'Procesando foto…';
  const reader = new FileReader();
  reader.onload = (ev)=>{
    resizeImageForDecode(ev.target.result, 1200, (resizedUrl)=>{
      const preview = document.getElementById('scan-preview');
      preview.src = resizedUrl;
      preview.style.display = 'block';
      document.getElementById('scan-placeholder').style.display = 'none';
      decodePhoto(resizedUrl);
    });
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});
function decodePhoto(dataUrl){
  const statusEl = document.getElementById('scan-status');
  if(typeof Quagga === 'undefined'){
    statusEl.textContent = 'No se pudo cargar el lector automático. Escribe el código abajo.';
    return;
  }
  statusEl.textContent = 'Leyendo código…';
  Quagga.decodeSingle({
    src: dataUrl,
    numOfWorkers: 0,
    inputStream: { size: 1000 },
    locator: { patchSize: 'large', halfSample: false },
    decoder: { readers: ['code_128_reader','ean_reader','ean_8_reader','upc_reader','upc_e_reader','code_39_reader'] }
  }, function(result){
    if(result && result.codeResult && result.codeResult.code){
      statusEl.textContent = 'Código detectado: ' + result.codeResult.code;
      handleScannedCode(result.codeResult.code);
    } else {
      statusEl.textContent = 'No se pudo leer el código en esa foto. Intenta de nuevo más cerca y con buena luz, o escríbelo abajo.';
    }
  });
}
document.getElementById('manual-use-btn').addEventListener('click', ()=>{
  const v = document.getElementById('manual-code').value.trim();
  if(v){ handleScannedCode(v); }
});
document.getElementById('scan-close-btn').addEventListener('click', closeScanner);

function handleScannedCode(code){
  beep(true);
  document.getElementById('scan-overlay').classList.remove('open');
  if(scanMode === 'comprar') fillCompraForm(code);
  else if(scanMode === 'verificar') runVerificacion(code);
}

/* ---------- TAB: Comprar ---------- */
let pendingBarcode = '';
function renderComprar(){
  const el = document.getElementById('tab-comprar');
  el.innerHTML = `
    <h2>Registrar compra</h2>
    <p class="hint">Escanea el código de barras de la prenda y asígnale un tag antes de guardarla.</p>
    <button class="btn btn-primary" id="btn-open-scan-comprar">📷 Escanear código</button>
    <div style="margin-top:16px;">
      <div class="code-display" id="compra-code-display" style="display:${pendingBarcode ? 'flex':'none'}">
        <span>Código escaneado: <strong>${pendingBarcode}</strong></span>
      </div>
      <div class="grid">
        <div><label>Tag / etiqueta</label><input id="f-tag" value="${nextTag()}"></div>
        <div><label>Código de barras</label><input id="f-barcode" value="${pendingBarcode}" placeholder="Escanea o escribe"></div>
        <div><label>Descripción de la prenda</label><input id="f-desc" placeholder="Ej: Camisa Nike azul"></div>
        <div><label>Talla</label><input id="f-talla" placeholder="Ej: M"></div>
        <div class="full">
          <label>Tipo de cliente</label>
          <select id="f-tipo-cliente">
            <option value="">Sin asignar todavía</option>
            <option value="mayorista_avanzado">Mayorista Avanzado (+20% · USD)</option>
            <option value="mayorista_parcero">Mayorista Parcero (+25% · USD)</option>
            <option value="detal">Detal (sin comisión · COP)</option>
          </select>
        </div>
        <div><label id="f-precio-compra-label">Precio de compra (USD)</label><input id="f-precio-compra" type="number" step="0.01" placeholder="0.00"></div>
        <div><label>Cliente (opcional, se puede asignar luego)</label><input id="f-cliente" list="clientes-list" placeholder="Nombre del cliente"></div>
      </div>
      <div class="row-actions">
        <button class="btn btn-dark" id="btn-guardar-compra">Guardar prenda</button>
        <button class="btn btn-ghost" id="btn-limpiar-compra">Limpiar</button>
      </div>
    </div>
    <div class="list" id="compra-recent"></div>
  `;
  document.getElementById('btn-open-scan-comprar').addEventListener('click', ()=>openScanner('comprar'));
  document.getElementById('btn-guardar-compra').addEventListener('click', guardarCompra);
  document.getElementById('btn-limpiar-compra').addEventListener('click', ()=>{ pendingBarcode=''; renderComprar(); });
  document.getElementById('f-tipo-cliente').addEventListener('change', e=>{
    const moneda = monedaDe(e.target.value) || 'USD';
    document.getElementById('f-precio-compra-label').textContent = `Precio de compra (${moneda})`;
  });
  renderRecentList('compra-recent');
}
function fillCompraForm(code){
  pendingBarcode = code;
  renderComprar();
}
async function guardarCompra(){
  const tag = document.getElementById('f-tag').value.trim();
  const barcode = document.getElementById('f-barcode').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  const talla = document.getElementById('f-talla').value.trim();
  const precioCompra = parseFloat(document.getElementById('f-precio-compra').value) || 0;
  const cliente = document.getElementById('f-cliente').value.trim();
  const tipoCliente = document.getElementById('f-tipo-cliente').value;
  if(!tag || !desc){ alert('Completa al menos el tag y la descripción de la prenda.'); return; }
  // el precio de venta arranca igual al de compra (mismo número, misma moneda: el campo de compra
  // ya se ingresa en la moneda correcta según el tipo de cliente elegido). Sigue siendo editable después.
  const ventaInicial = precioCompra;
  const nuevoItem = {
    id: uid(), tag, barcode, descripcion: desc, talla,
    precioCompra, precioVenta: ventaInicial, cliente, tipoCliente, estado: 'comprado',
    fecha: new Date().toISOString()
  };
  await addItemRemote(nuevoItem);
  pendingBarcode = '';
  renderAll();
}
function renderRecentList(containerId){
  const container = document.getElementById(containerId);
  if(!container) return;
  const recent = [...ITEMS].slice(-8).reverse();
  if(recent.length === 0){ container.innerHTML = '<p class="empty">Aún no hay prendas registradas.</p>'; return; }
  container.innerHTML = recent.map(it => `
    <div class="item-row">
      <div class="meta">
        <span class="tg">${it.tag}</span>
        <span>${it.descripcion}${it.talla ? ' · '+it.talla : ''}</span>
      </div>
      <span class="badge ${it.estado}">${it.estado}</span>
    </div>
  `).join('');
}

/* ---------- TAB: Verificar ---------- */
let lastVerifyResult = null;
function renderVerificar(){
  const el = document.getElementById('tab-verificar');
  const comprados = ITEMS.filter(i=>i.estado==='comprado').length;
  const verificados = ITEMS.filter(i=>i.estado==='verificado' || i.estado==='facturado').length;
  el.innerHTML = `
    <h2>Verificar al llegar a casa</h2>
    <p class="hint">Vuelve a escanear cada prenda para confirmar que coincide con lo comprado. Pendientes: <strong>${comprados}</strong> · Verificadas: <strong>${verificados}</strong></p>
    <button class="btn btn-primary" id="btn-open-scan-verificar">📷 Escanear para verificar</button>
    <div id="verify-result" style="margin-top:16px;"></div>
    <div class="list" id="verify-list"></div>
  `;
  document.getElementById('btn-open-scan-verificar').addEventListener('click', ()=>openScanner('verificar'));
  renderVerifyResult();
  renderVerifyList();
}
function renderVerifyResult(){
  const box = document.getElementById('verify-result');
  if(!box) return;
  if(!lastVerifyResult){ box.innerHTML=''; return; }
  if(lastVerifyResult.match){
    const it = lastVerifyResult.item;
    box.innerHTML = `<div class="code-display" style="border-color:var(--success); background:var(--success-bg); flex-direction:column; align-items:flex-start; gap:4px;">
      <div>✅ Coincide — <span class="tagnum">${it.tag}</span> · ${it.descripcion}${it.talla ? ' · '+it.talla:''}</div>
      <div style="font-size:16px; font-weight:700;">👤 Cliente: ${it.cliente ? it.cliente : '<span style="color:var(--danger); font-weight:400;">Sin asignar todavía</span>'}</div>
    </div>`;
  } else {
    box.innerHTML = `<div class="code-display" style="border-color:var(--danger); background:var(--danger-bg);">
      ⚠️ No se encontró ninguna compra con el código <strong>${lastVerifyResult.code}</strong>. Revisa si fue registrada.
    </div>`;
  }
}
async function runVerificacion(code){
  const item = ITEMS.find(i => i.barcode && i.barcode === code && i.estado === 'comprado');
  if(item){
    const fechaVerificacion = new Date().toISOString();
    await updateItemRemote(item.id, { estado: 'verificado', fechaVerificacion });
    lastVerifyResult = { match:true, item: { ...item, estado:'verificado', fechaVerificacion } };
  } else {
    beep(false);
    lastVerifyResult = { match:false, code };
  }
  renderAll();
}
function renderVerifyList(){
  const container = document.getElementById('verify-list');
  if(!container) return;
  const pending = ITEMS.filter(i=>i.estado==='comprado');
  if(pending.length===0){ container.innerHTML = '<p class="empty">No hay prendas pendientes por verificar.</p>'; return; }
  container.innerHTML = pending.map(it => `
    <div class="item-row">
      <div class="meta"><span class="tg">${it.tag}</span><span>${it.descripcion}${it.talla?' · '+it.talla:''}</span></div>
      <span class="badge comprado">pendiente</span>
    </div>
  `).join('');
}

/* ---------- TAB: Inventario ---------- */
let invFilterCliente = '';
let invFilterEstado = '';
let invSearch = '';
function fmtFecha(iso){
  if(!iso) return '—';
  try{ return new Date(iso).toLocaleDateString('es-CO', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }); }
  catch(e){ return '—'; }
}
function renderInventario(){
  const el = document.getElementById('tab-inventario');
  const clientes = [...new Set(ITEMS.map(i=>i.cliente).filter(Boolean))];
  let filtered = ITEMS.filter(i=>{
    if(invFilterCliente && i.cliente !== invFilterCliente) return false;
    if(invFilterEstado){
      if(i.estado !== invFilterEstado) return false;
    } else {
      if(i.estado === 'pagado') return false; // los pagados no se acumulan en la vista normal, quedan como historial
    }
    if(invSearch){
      const s = invSearch.toLowerCase();
      if(!(i.tag.toLowerCase().includes(s) || i.descripcion.toLowerCase().includes(s) || (i.barcode||'').toLowerCase().includes(s))) return false;
    }
    return true;
  });
  filtered.sort((a,b) => new Date(b.fecha||0) - new Date(a.fecha||0));
  el.innerHTML = `
    <h2>Inventario</h2>
    <p class="hint">Clasifica cada prenda por cliente y tipo, y define el precio de venta. Los productos ya <strong>pagados</strong> se ocultan aquí para mantener la vista despejada — selecciona el filtro "Pagado" para consultar ese historial.</p>
    <div class="filters">
      <input type="text" id="inv-search" placeholder="Buscar por tag, código o descripción" value="${invSearch}">
      <select id="inv-filter-cliente"><option value="">Todos los clientes</option>${clientes.map(c=>`<option ${c===invFilterCliente?'selected':''}>${c}</option>`).join('')}</select>
      <select id="inv-filter-estado">
        <option value="">Activos (sin pagados)</option>
        <option value="comprado" ${invFilterEstado==='comprado'?'selected':''}>Comprado</option>
        <option value="verificado" ${invFilterEstado==='verificado'?'selected':''}>Verificado</option>
        <option value="facturado" ${invFilterEstado==='facturado'?'selected':''}>Facturado</option>
        <option value="pagado" ${invFilterEstado==='pagado'?'selected':''}>Pagado (historial)</option>
      </select>
      <button class="btn btn-ghost btn-sm" id="btn-export-csv">⬇ Exportar CSV</button>
    </div>
    <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>Tag</th><th>Código</th><th>Descripción</th><th>Talla</th>
        <th>Compra</th><th>Tipo cliente</th><th>Venta</th><th>Cliente</th><th>Verificado</th><th>Estado</th><th></th>
      </tr></thead>
      <tbody id="inv-tbody"></tbody>
    </table>
    </div>
  `;
  const tbody = document.getElementById('inv-tbody');
  if(filtered.length===0){
    tbody.innerHTML = `<tr><td colspan="11" class="empty">No hay prendas que coincidan.</td></tr>`;
  } else {
    tbody.innerHTML = filtered.map(it => `
      <tr data-id="${it.id}">
        <td class="tg" style="font-family:var(--mono); font-weight:700; color:var(--accent-deep);">${it.tag}</td>
        <td style="font-family:var(--mono); font-size:11.5px;">${it.barcode||'—'}</td>
        <td>${it.descripcion}</td>
        <td>${it.talla||'—'}</td>
        <td style="font-size:12px;">${fmtCompra(it)}</td>
        <td>
          <select class="edit-tipo" style="width:150px; font-size:11.5px;">
            <option value="" ${!it.tipoCliente?'selected':''}>Sin asignar</option>
            <option value="mayorista_avanzado" ${it.tipoCliente==='mayorista_avanzado'?'selected':''}>Mayorista Avanzado</option>
            <option value="mayorista_parcero" ${it.tipoCliente==='mayorista_parcero'?'selected':''}>Mayorista Parcero</option>
            <option value="detal" ${it.tipoCliente==='detal'?'selected':''}>Detal</option>
          </select>
        </td>
        <td>
          <input type="number" step="0.01" class="edit-precio" value="${it.precioVenta||0}" style="width:90px">
          <div style="font-size:9.5px; color:var(--ink-soft);">${monedaDe(it.tipoCliente) || 'sin tipo'}</div>
        </td>
        <td><input type="text" class="edit-cliente" value="${it.cliente||''}" list="clientes-list" style="width:110px"></td>
        <td style="font-size:11.5px; color:var(--ink-soft);">${fmtFecha(it.fechaVerificacion)}</td>
        <td style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
          <span class="badge ${it.estado}">${it.estado}</span>
          ${it.estado === 'facturado' ? '<button class="btn btn-sm btn-primary marcar-pagado-btn" style="padding:4px 8px; font-size:11px;">✓ Pagado</button>' : ''}
        </td>
        <td><button class="del-btn" title="Eliminar">✕</button></td>
      </tr>
    `).join('');
  }
  document.getElementById('inv-search').addEventListener('input', e=>{ invSearch = e.target.value; renderInventario(); });
  document.getElementById('inv-filter-cliente').addEventListener('change', e=>{ invFilterCliente = e.target.value; renderInventario(); });
  document.getElementById('inv-filter-estado').addEventListener('change', e=>{ invFilterEstado = e.target.value; renderInventario(); });
  document.getElementById('btn-export-csv').addEventListener('click', exportCSV);
  tbody.querySelectorAll('tr').forEach(row=>{
    const id = row.dataset.id;
    row.querySelector('.edit-precio')?.addEventListener('change', async e=>{
      await updateItemRemote(id, { precioVenta: parseFloat(e.target.value)||0 });
    });
    row.querySelector('.edit-tipo')?.addEventListener('change', async e=>{
      await updateItemRemote(id, { tipoCliente: e.target.value });
    });
    row.querySelector('.edit-cliente')?.addEventListener('change', async e=>{
      await updateItemRemote(id, { cliente: e.target.value.trim() });
    });
    row.querySelector('.marcar-pagado-btn')?.addEventListener('click', async ()=>{
      await updateItemRemote(id, { estado: 'pagado', fechaPago: new Date().toISOString() });
    });
    row.querySelector('.del-btn')?.addEventListener('click', async ()=>{
      if(confirm('¿Eliminar esta prenda del inventario?')){
        await deleteItemRemote(id);
      }
    });
  });
}
function exportCSV(){
  const headers = ['tag','barcode','descripcion','talla','precioCompra','precioVenta','cliente','tipoCliente','estado','fecha','fechaVerificacion','fechaPago'];
  const rows = ITEMS.map(it => headers.map(h => `"${String(it[h]??'').replace(/"/g,'""')}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'inventario_tagout.csv'; a.click();
  URL.revokeObjectURL(url);
}

function agruparParaFactura(items){
  const map = new Map();
  items.forEach(it => {
    const key = it.descripcion + '||' + (Number(it.precioVenta)||0);
    if(!map.has(key)) map.set(key, { descripcion: it.descripcion, precio: Number(it.precioVenta)||0, tallas: {}, cantidad: 0 });
    const g = map.get(key);
    g.cantidad++;
    const t = (it.talla || '').trim();
    if(t){ g.tallas[t] = (g.tallas[t]||0) + 1; }
  });
  return [...map.values()].map(g => ({
    ...g,
    importe: g.precio * g.cantidad,
    tallaLines: Object.entries(g.tallas).map(([t,c]) => c > 1 ? `${t} (${c})` : t)
  }));
}

function renderFacturar(){
  const el = document.getElementById('tab-facturar');
  const clientes = [...new Set(ITEMS.filter(i=>i.cliente).map(i=>i.cliente))];
  const pendientes = ITEMS.filter(i => i.cliente === facturaCliente && i.estado !== 'facturado' && i.estado !== 'pagado');

  el.innerHTML = `
    <h2>Facturar por cliente</h2>
    <p class="hint">Selecciona un cliente. El tipo (Mayorista Avanzado, Mayorista Parcero o Detal) se toma automáticamente de lo que se asignó en Compras/Inventario.</p>
    <div class="grid">
      <div class="full">
        <label>Cliente</label>
        <select id="fact-cliente">
          <option value="">Selecciona un cliente</option>
          ${clientes.map(c=>`<option ${c===facturaCliente?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
    </div>
    <div id="factura-area"></div>
  `;
  document.getElementById('fact-cliente').addEventListener('change', e=>{ facturaCliente = e.target.value; facturaNumero=''; facturaPagada=0; renderFacturar(); });
  const area = document.getElementById('factura-area');
  if(!facturaCliente){ area.innerHTML = '<p class="empty">Elige un cliente para continuar.</p>'; return; }
  if(pendientes.length===0){
    area.innerHTML = '<p class="empty">Este cliente no tiene prendas pendientes de facturar.</p>';
    return;
  }

  // el tipo de cliente se detecta de las prendas mismas (asignado en Compras o Inventario)
  const tiposEncontrados = [...new Set(pendientes.map(i=>i.tipoCliente).filter(Boolean))];
  if(tiposEncontrados.length === 0){
    area.innerHTML = '<p class="empty">Estas prendas todavía no tienen un <strong>tipo de cliente</strong> asignado (Mayorista Avanzado / Mayorista Parcero / Detal). Asígnalo en Compras o en la columna "Tipo cliente" de Inventario antes de facturar.</p>';
    return;
  }
  if(tiposEncontrados.length > 1){
    area.innerHTML = `<p class="empty">⚠️ Este cliente tiene prendas con <strong>tipos distintos</strong> (${tiposEncontrados.map(t=>TIPOS_CLIENTE[t].label).join(' y ')}). Corrige el tipo de cliente en Inventario para que todas coincidan antes de facturar — así se puede calcular la comisión y la moneda correctas.</p>`;
    return;
  }
  const tipoCliente = tiposEncontrados[0];
  const tipoInfo = TIPOS_CLIENTE[tipoCliente];
  const moneda = tipoInfo.moneda;
  const fmt = moneda === 'COP' ? fmtCOP : fmtUSD;

  const subtotal = pendientes.reduce((s,i)=> s + (Number(i.precioVenta)||0), 0);
  const recargo = subtotal * tipoInfo.recargo;
  const total = subtotal + recargo;
  const totalPorPagar = Math.max(total - (Number(facturaPagada)||0), 0);

  if(!facturaNumero){
    facturaNumero = nextInvoiceNumberLocal();
  }

  const grupos = agruparParaFactura(pendientes);
  const fechaHoy = new Date().toLocaleDateString('es-CO', { year:'numeric', month:'short', day:'numeric' });

  area.innerHTML = `
    <div class="invoice" id="invoice-box">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:10px;">
        <img src="${LOGO_B64}" alt="Logo" style="height:60px;">
        <div style="text-align:right; font-size:12px; color:var(--ink-soft);">
          <div>${NEGOCIO.telefono}</div>
          <div>${NEGOCIO.correo}</div>
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid var(--ink); padding-bottom:8px; margin-bottom:12px;">
        <h3 style="margin:0; font-size:18px;">${NEGOCIO.nombre} ${tipoInfo.label}</h3>
        <h3 style="margin:0; font-size:20px; letter-spacing:.05em;">FACTURA</h3>
      </div>
      <div style="display:flex; justify-content:space-between; margin-bottom:14px; font-size:13px;">
        <div>
          <div style="text-transform:uppercase; font-size:10.5px; color:var(--ink-soft); letter-spacing:.04em;">Factura para:</div>
          <div style="font-weight:700; font-size:15px;">${facturaCliente}</div>
        </div>
        <div style="text-align:right; font-family:var(--mono);">
          <div><span style="color:var(--ink-soft);">NÚMERO: </span><input id="fact-numero-input" value="${facturaNumero}" style="width:110px; display:inline-block; padding:3px 6px; font-size:12.5px;"></div>
          <div style="margin-top:3px;"><span style="color:var(--ink-soft);">FECHA: </span>${fechaHoy}</div>
          <div style="margin-top:3px;"><span style="color:var(--ink-soft);">VENCIMIENTO: </span>En el recibo</div>
          <div style="margin-top:3px;"><span style="color:var(--ink-soft);">MONEDA: </span>${moneda}</div>
        </div>
      </div>
      <table>
        <thead><tr><th>Descripción</th><th>Cantidad</th><th>Precio por unidad</th><th>Importe</th></tr></thead>
        <tbody>
          ${grupos.map(g => `
            <tr>
              <td>
                <div style="font-weight:600;">${g.descripcion}</div>
                ${g.tallaLines.map(t=>`<div style="font-size:11.5px; color:var(--ink-soft);">${t}</div>`).join('')}
              </td>
              <td>${g.cantidad}</td>
              <td>${fmt(g.precio)}</td>
              <td>${fmt(g.importe)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div style="margin-top:12px; padding-top:10px; border-top:1px dashed var(--line); font-size:13.5px; display:flex; flex-direction:column; gap:5px; max-width:300px; margin-left:auto;">
        <div style="display:flex; justify-content:space-between;"><span>SUBTOTAL:</span><span>${fmt(subtotal)}</span></div>
        ${tipoInfo.recargo > 0 ? `<div style="display:flex; justify-content:space-between; color:var(--accent-deep);"><span>PERSONAL SHOPPER (${Math.round(tipoInfo.recargo*100)}%):</span><span>${fmt(recargo)}</span></div>` : ''}
        <div style="display:flex; justify-content:space-between; font-weight:700; padding-top:4px; border-top:1px solid var(--line);"><span>TOTAL:</span><span>${fmt(total)}</span></div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>PAGADA:</span>
          <input id="fact-pagada-input" type="number" step="0.01" value="${facturaPagada}" style="width:110px; text-align:right; padding:4px 6px; font-size:13px;">
        </div>
      </div>
      <div class="invoice-total">TOTAL POR PAGAR: ${fmt(totalPorPagar)}</div>
    </div>
    <div class="row-actions no-print">
      <button class="btn btn-dark" id="btn-imprimir">🖨 Imprimir / Exportar PDF</button>
      <button class="btn btn-primary" id="btn-marcar-facturado">Marcar como facturado</button>
    </div>
  `;
  document.getElementById('fact-numero-input').addEventListener('change', e=>{ facturaNumero = e.target.value.trim(); });
  document.getElementById('fact-pagada-input').addEventListener('change', e=>{ facturaPagada = parseFloat(e.target.value)||0; renderFacturar(); });
  document.getElementById('btn-imprimir').addEventListener('click', ()=>window.print());
  document.getElementById('btn-marcar-facturado').addEventListener('click', async ()=>{
    await batchUpdateEstado(pendientes.map(i=>i.id), 'facturado', { facturaNumero });
    facturaNumero = ''; facturaPagada = 0;

  });
}

/* ---------- Stats + datalist ---------- */
function renderStats(){
  const bar = document.getElementById('stats-bar');
  const comprados = ITEMS.length;
  const verificados = ITEMS.filter(i=>i.estado==='verificado'||i.estado==='facturado'||i.estado==='pagado').length;
  const facturados = ITEMS.filter(i=>i.estado==='facturado'||i.estado==='pagado').length;
  const pagados = ITEMS.filter(i=>i.estado==='pagado').length;
  const valorVentaUSD = ITEMS.filter(i=>monedaDe(i.tipoCliente)==='USD').reduce((s,i)=>s+(i.precioVenta||0),0);
  const valorVentaCOP = ITEMS.filter(i=>monedaDe(i.tipoCliente)==='COP').reduce((s,i)=>s+(i.precioVenta||0),0);
  bar.innerHTML = `
    <div class="stat"><div class="n">${comprados}</div><div class="l">Prendas</div></div>
    <div class="stat"><div class="n">${verificados}</div><div class="l">Verificadas</div></div>
    <div class="stat"><div class="n">${facturados}</div><div class="l">Facturadas</div></div>
    <div class="stat"><div class="n">${pagados}</div><div class="l">Pagadas</div></div>
    <div class="stat"><div class="n">${fmtUSD(valorVentaUSD)}</div><div class="l">Venta mayoristas</div></div>
    <div class="stat"><div class="n">${fmtCOP(valorVentaCOP)}</div><div class="l">Venta detal</div></div>
  `;
  let dl = document.getElementById('clientes-list');
  if(!dl){ dl = document.createElement('datalist'); dl.id='clientes-list'; document.body.appendChild(dl); }
  const clientes = [...new Set(ITEMS.map(i=>i.cliente).filter(Boolean))];
  dl.innerHTML = clientes.map(c=>`<option value="${c}">`).join('');
}

/* ---------- Tabs switching ---------- */
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  ['comprar','verificar','inventario','facturar'].forEach(t=>{
    document.getElementById('tab-'+t).style.display = (t===name) ? 'block' : 'none';
  });
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>switchTab(btn.dataset.tab));
});

function renderAll(){
  renderStats();
  renderComprar();
  renderVerificar();
  renderInventario();
  renderFacturar();
}

loadItems();
</script>
</body>
</html>
